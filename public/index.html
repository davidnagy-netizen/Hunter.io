<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUNTER — szabályalapú pályázatkereső MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1726; --ink-2:#16233A; --ink-3:#1E3050;
    --paper:#F5F7FA; --surface:#FFFFFF; --surface-2:#FBFCFD;
    --line:#E3E8EF; --line-strong:#CDD5E0;
    --text:#16202E; --muted:#64707F; --muted-2:#8A94A6;
    --gold:#D99A2B; --gold-deep:#B87C15; --gold-bg:#FBF2DE;
    --green:#199268; --green-bg:#E4F4EC;
    --amber:#DD8331; --amber-bg:#FBEEDF;
    --red:#CA4A4A; --red-bg:#FAE7E7;
    --slate:#8A94A6; --slate-bg:#EEF1F5;
    --blue:#2E6BD6; --blue-bg:#E7EFFB;
    --radius:14px; --radius-sm:10px; --radius-lg:20px;
    --shadow:0 1px 2px rgba(16,23,38,.04), 0 8px 24px -12px rgba(16,23,38,.14);
    --shadow-lg:0 2px 4px rgba(16,23,38,.05), 0 24px 48px -20px rgba(16,23,38,.28);
    --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --display:"Space Grotesk","Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden;width:100%;max-width:100%}
  body{font-family:var(--font);color:var(--text);background:var(--paper);
    -webkit-font-smoothing:antialiased;line-height:1.5;font-size:15px;font-weight:450}
  h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.12;letter-spacing:-.01em;margin:0}
  p{margin:0}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  .num{font-family:var(--display);font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums}
  ::selection{background:var(--gold);color:#fff}

  /* ---------- shared ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-weight:600;font-size:15px;border-radius:11px;padding:12px 20px;transition:.16s ease;
    border:1px solid transparent;white-space:nowrap}
  .btn:active{transform:translateY(1px)}
  .btn-gold{background:var(--gold);color:#1c1403}
  .btn-gold:hover{background:var(--gold-deep);color:#fff}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-dark:hover{background:var(--ink-3)}
  .btn-ghost{background:transparent;color:var(--text);border-color:var(--line-strong)}
  .btn-ghost:hover{border-color:var(--ink);background:#fff}
  .btn-ghost-light{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.24)}
  .btn-ghost-light:hover{background:rgba(255,255,255,.12)}
  .btn-block{width:100%}
  .btn-sm{padding:9px 15px;font-size:13.5px;border-radius:9px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    padding:4px 10px;border-radius:100px;letter-spacing:.01em}
  .badge-green{background:var(--green-bg);color:var(--green)}
  .badge-amber{background:var(--amber-bg);color:var(--amber)}
  .badge-red{background:var(--red-bg);color:var(--red)}
  .badge-slate{background:var(--slate-bg);color:var(--slate)}
  .badge-gold{background:var(--gold-bg);color:var(--gold-deep)}
  .badge-blue{background:var(--blue-bg);color:var(--blue)}

  .app{min-height:100vh}
  .hidden{display:none !important}

  /* ---------- logo ---------- */
  .logo{display:inline-flex;align-items:center;gap:9px;font-family:var(--display);
    font-weight:700;font-size:19px;letter-spacing:.02em}
  .logo .mark{width:26px;height:26px;flex:0 0 26px;position:relative}
  .logo span:first-child{line-height:1.05;display:block}
  .logo small{font-size:8.5px;font-weight:600;letter-spacing:.15em;color:var(--gold);
    display:block;margin-top:2px;line-height:1;text-transform:uppercase}
  .logo-wrap{display:flex;flex-direction:column;line-height:1;gap:0}

  /* ================= LANDING ================= */
  .landing{background:var(--ink);color:#EAF0F7;overflow:hidden}
  .nav{max-width:1120px;margin:0 auto;padding:22px 24px;display:flex;align-items:center;justify-content:space-between}
  .nav .logo{color:#fff}
  .nav-links{display:flex;gap:28px;align-items:center;font-size:14.5px;color:#AEBACB;font-weight:500}
  .nav-links a:hover{color:#fff}

  .hero{max-width:1120px;margin:0 auto;padding:40px 24px 76px;
    display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
  .hero-eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600;
    color:var(--gold);background:rgba(217,154,43,.1);border:1px solid rgba(217,154,43,.28);
    padding:7px 14px;border-radius:100px;margin-bottom:26px}
  .hero h1{font-size:52px;letter-spacing:-.025em;color:#fff;margin-bottom:22px}
  .hero .lead{font-size:18px;color:#B4C0D0;max-width:33ch;margin-bottom:32px;line-height:1.55}
  .hero-cta{display:flex;gap:14px;flex-wrap:wrap}
  .hero-trust{margin-top:34px;font-size:12.5px;color:#7C8AA0}
  .hero-trust b{color:#B4C0D0;font-weight:600}

  /* live preview card in hero */
  .preview{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
    color:var(--text);padding:22px;position:relative;transform:rotate(.6deg)}
  .preview::before{content:"";position:absolute;inset:-1px;border-radius:var(--radius-lg);
    background:linear-gradient(160deg,rgba(217,154,43,.5),transparent 42%);z-index:-1;filter:blur(1px)}
  .preview-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px}
  .preview-head .prog{font-size:12px;color:var(--gold-deep);font-weight:700;letter-spacing:.02em}
  .preview-head h3{font-size:18px;margin-top:4px}
  .score-ring{flex:0 0 auto;text-align:center}
  .ring-val{font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
  .ring-lbl{font-size:9px;color:var(--muted);letter-spacing:.14em;margin-top:2px;text-transform:uppercase}
  .why{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .why-row{display:flex;gap:9px;font-size:13.5px;align-items:flex-start}
  .why-row .ic{flex:0 0 auto;margin-top:1px}
  .why-row b{font-weight:600}
  .why-row .yr{color:var(--muted);font-weight:500}
  .preview-foot{display:flex;justify-content:space-between;margin-top:16px;padding-top:14px;
    border-top:1px solid var(--line);font-size:13px}
  .preview-foot b{font-family:var(--display);font-weight:600}

  .section{max-width:1120px;margin:0 auto;padding:64px 24px}
  .section-light{background:var(--paper);color:var(--text)}
  .kicker{font-size:13px;font-weight:600;color:var(--gold-deep);margin-bottom:12px}
  .section h2{font-size:34px;letter-spacing:-.02em;margin-bottom:14px;max-width:20ch}
  .section .sub{color:var(--muted);font-size:16.5px;max-width:56ch;margin-bottom:40px}

  .compare{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .compare-col{border-radius:var(--radius);padding:26px;border:1px solid var(--line)}
  .compare-old{background:#fff}
  .compare-new{background:var(--ink);color:#EAF0F7;border-color:var(--ink)}
  .compare-col h4{font-size:14px;letter-spacing:.02em;margin-bottom:18px;text-transform:uppercase;font-family:var(--font);font-weight:700}
  .compare-old h4{color:var(--muted)}
  .compare-new h4{color:var(--gold)}
  .flow{display:flex;flex-direction:column;gap:10px}
  .flow-step{font-size:15px;padding:11px 14px;border-radius:10px}
  .compare-old .flow-step{background:var(--paper);color:var(--muted)}
  .compare-new .flow-step{background:rgba(255,255,255,.06);color:#DCE4EE}
  .compare-new .flow-step.hi{background:var(--gold);color:#1c1403;font-weight:600}
  /* ---- felnagyított, konkrét példa a különbség szekcióhoz ---- */
  .cmp2 h2{font-size:40px;max-width:22ch}
  .cmp2 .sub{font-size:17px}
  .scenario{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
    border-left:4px solid var(--gold);border-radius:14px;padding:18px 22px;margin:8px 0 28px;box-shadow:var(--shadow)}
  .scenario-lbl{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--gold-deep);text-transform:uppercase;flex:0 0 auto}
  .scenario-facts{display:flex;gap:12px 26px;flex-wrap:wrap;font-size:15.5px;color:var(--muted)}
  .scenario-facts span{display:inline-flex;gap:6px}
  .scenario-facts b{color:var(--text);font-weight:600}
  .cmp2 .compare{grid-template-columns:1fr 1.12fr;gap:24px;align-items:stretch}
  .cmp2 .compare-col{padding:32px}
  .cmp2 .compare-col h4{font-size:13px;margin-bottom:22px}
  .old-count{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
  .old-count .num{font-family:var(--display);font-weight:700;font-size:52px;color:var(--muted-2);line-height:.9}
  .old-count .cl{color:var(--muted);font-size:15.5px}
  .old-list{font-size:13.5px;color:var(--muted-2);line-height:1.95;background:var(--paper);
    border:1px dashed var(--line-strong);border-radius:11px;padding:14px 16px;margin-bottom:20px}
  .old-steps{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
  .old-steps div{font-size:14.5px;color:var(--muted);padding:12px 15px;background:var(--paper);border-radius:10px}
  .old-verdict{font-size:14px;color:var(--red);font-weight:600;display:flex;gap:8px;align-items:center}
  .new-head{font-size:18px;color:#EAF0F7;margin-bottom:18px}
  .new-head b{color:var(--gold);font-family:var(--display);font-size:24px;padding:0 2px}
  .ex-cards{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
  .ex-card{display:grid;grid-template-columns:54px 1fr;gap:15px;align-items:center;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.11);border-radius:13px;padding:14px 16px}
  .ex-card .exs{font-family:var(--display);font-weight:700;font-size:26px;color:var(--gold);text-align:center;line-height:1}
  .ex-card .exs small{display:block;font-family:var(--font);font-size:8px;color:#7C8AA0;letter-spacing:.12em;margin-top:3px;font-weight:600}
  .ex-prog{font-size:11.5px;color:var(--gold);font-weight:700;letter-spacing:.01em}
  .ex-title{font-size:15px;color:#fff;font-weight:600;margin:2px 0 6px}
  .ex-meta{font-size:12.5px;color:#9DAABB;font-family:var(--display)}
  .ex-meta b{color:#DCE4EE;font-weight:600}
  .ex-excluded{border-top:1px solid rgba(255,255,255,.11);padding-top:18px}
  .ex-x-lbl{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:#8A98AC;text-transform:uppercase;display:block;margin-bottom:12px}
  .ex-x{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:#AEBACB;margin-bottom:9px;line-height:1.4}
  .ex-x .xm{color:#E58F8F;flex:0 0 auto;font-weight:700}
  .ex-x b{color:#CFD8E3;font-weight:600}
  @media(max-width:900px){
    .cmp2 h2{font-size:29px}
    .cmp2 .compare{grid-template-columns:1fr}
  }


  .steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .step-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px 24px}
  .step-n{font-family:var(--display);font-weight:700;font-size:15px;color:#fff;background:var(--ink);
    width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  .step-card h3{font-size:18px;margin-bottom:8px}
  .step-card p{color:var(--muted);font-size:14.5px}

  .sources{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
  .source-chip{background:#fff;border:1px solid var(--line);border-radius:100px;padding:10px 18px;
    font-size:14px;font-weight:500;display:flex;align-items:center;gap:9px}
  .source-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}

  .price-teaser{background:var(--ink);color:#fff;border-radius:var(--radius-lg);padding:48px;
    display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center}
  .price-teaser h2{font-size:30px;margin-bottom:14px;color:#fff}
  .price-teaser p{color:#B4C0D0;max-width:42ch}
  .price-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
    border-radius:var(--radius);padding:28px;text-align:center}
  .price-box .amt{font-family:var(--display);font-size:40px;font-weight:700;color:#fff}
  .price-box .per{color:#8A98AC;font-size:14px}
  .price-box .cmp{color:var(--gold);font-size:13px;margin:14px 0 20px;font-weight:600}

  footer.land{background:var(--ink-2);color:#8A98AC;padding:34px 24px;text-align:center;font-size:13px}

  /* ================= APP SHELL ================= */
  .shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
  .rail{background:var(--ink);color:#C6D0DD;padding:22px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .rail .logo{color:#fff;padding:0 8px 22px}
  .rail-nav{display:flex;flex-direction:column;gap:3px;flex:1}
  .rail-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;
    font-size:14.5px;font-weight:500;color:#AEBACB;transition:.14s;text-align:left;width:100%}
  .rail-item:hover{background:rgba(255,255,255,.05);color:#fff}
  .rail-item.active{background:var(--gold);color:#1c1403;font-weight:600}
  .rail-item .ic{width:19px;height:19px;flex:0 0 19px}
  .rail-item .tag{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.12);
    color:#fff;padding:2px 7px;border-radius:100px}
  .rail-item.active .tag{background:rgba(0,0,0,.15);color:#1c1403}
  .rail-lock{margin-left:auto}
  .rail-company{border-top:1px solid rgba(255,255,255,.1);padding-top:14px;margin-top:8px;
    display:flex;align-items:center;gap:10px;font-size:13px}
  .rail-company .av{width:34px;height:34px;border-radius:9px;background:var(--gold);color:#1c1403;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--display);flex:0 0 34px}
  .rail-company b{color:#fff;font-weight:600;display:block;font-size:13.5px}
  .rail-company span{color:#8A98AC;font-size:11.5px}

  .main{padding:34px 40px 90px;max-width:1080px}
  .page-head{margin-bottom:28px}
  .page-head h1{font-size:30px;letter-spacing:-.02em;margin-bottom:6px}
  .page-head p{color:var(--muted);font-size:15.5px}

  /* stat cards */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .stat .v{font-family:var(--display);font-size:32px;font-weight:700;line-height:1}
  .stat .l{color:var(--muted);font-size:13.5px;margin-top:7px}
  .stat.hero-stat{background:var(--ink);color:#fff;border-color:var(--ink)}
  .stat.hero-stat .l{color:#9DAABB}

  .section-title{display:flex;align-items:center;justify-content:space-between;margin:34px 0 16px}
  .section-title h2{font-size:20px}
  .section-title .link{font-size:14px;color:var(--gold-deep);font-weight:600}

  /* opportunity card */
  .opp-grid{display:flex;flex-direction:column;gap:14px}
  .opp{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;
    display:grid;grid-template-columns:64px 1fr auto;gap:20px;align-items:center;transition:.15s;cursor:pointer}
  .opp:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
  .opp-score{text-align:center}
  .opp-score .n{font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
  .opp-score .b{font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
  .opp-body .prog{font-size:12px;font-weight:700;color:var(--gold-deep);letter-spacing:.01em}
  .opp-body h3{font-size:17px;margin:4px 0 10px}
  .opp-meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
  .opp-meta b{color:var(--text);font-weight:600}
  .opp-meta .num{font-family:var(--display)}
  .opp-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .opp-cta{color:var(--gold-deep);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:5px}

  .score-bar{height:5px;border-radius:100px;background:var(--line);overflow:hidden;width:64px;margin-top:7px}
  .score-bar i{display:block;height:100%;border-radius:100px}

  /* calendar */
  .cal{display:flex;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .cal-month{padding:16px 20px;display:grid;grid-template-columns:120px 1fr;gap:16px;border-bottom:1px solid var(--line)}
  .cal-month:last-child{border-bottom:none}
  .cal-mname{font-family:var(--display);font-weight:600;font-size:16px}
  .cal-mname span{display:block;font-size:12px;color:var(--muted);font-weight:400;font-family:var(--font)}
  .cal-events{display:flex;flex-direction:column;gap:8px}
  .cal-ev{display:flex;align-items:center;gap:11px;font-size:14px;padding:9px 12px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
  .cal-ev:hover{border-color:var(--line-strong)}
  .cal-ev .cdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
  .cal-ev .cname{font-weight:500;flex:1}
  .cal-ev .cdate{color:var(--muted);font-size:12.5px;font-family:var(--display)}

  .empty{background:#fff;border:1px dashed var(--line-strong);border-radius:var(--radius);
    padding:40px 24px;text-align:center;color:var(--muted)}
  .empty h3{color:var(--text);font-size:17px;margin-bottom:6px}

  /* ================= DETAIL ================= */
  .detail-back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-weight:500;
    font-size:14px;margin-bottom:22px}
  .detail-back:hover{color:var(--text)}
  .detail-hero{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:30px 32px;display:grid;grid-template-columns:1fr 168px;gap:32px;margin-bottom:24px}
  .detail-hero .prog{font-size:13px;font-weight:700;color:var(--gold-deep)}
  .detail-hero h1{font-size:28px;margin:8px 0 16px;letter-spacing:-.02em}
  .detail-facts{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:4px}
  .fact .fl{font-size:12px;color:var(--muted);margin-bottom:2px}
  .fact .fv{font-family:var(--display);font-weight:600;font-size:16px}
  .big-ring{position:relative;width:156px;height:156px;margin:0 auto}
  .big-ring svg{transform:rotate(-90deg)}
  .big-ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .big-ring .bn{font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
  .big-ring .bt{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
  .band-lbl{text-align:center;margin-top:12px;font-weight:600;font-size:13.5px}

  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;margin-bottom:20px}
  .panel h2{font-size:19px;margin-bottom:4px}
  .panel .psub{color:var(--muted);font-size:14px;margin-bottom:18px}

  /* factor rows */
  .factor{border-bottom:1px solid var(--line)}
  .factor:last-child{border-bottom:none}
  .factor-head{display:flex;align-items:center;gap:14px;padding:14px 0;cursor:pointer}
  .factor-head .fname{font-weight:600;font-size:15px;flex:0 0 160px}
  .factor-head .ftrack{flex:1;height:7px;background:var(--line);border-radius:100px;overflow:hidden}
  .factor-head .ftrack i{display:block;height:100%;border-radius:100px;background:var(--ink)}
  .factor-head .fpct{font-family:var(--display);font-weight:600;font-size:15px;width:44px;text-align:right}
  .factor-head .fchev{color:var(--muted);transition:.2s}
  .factor.open .fchev{transform:rotate(90deg)}
  .factor-body{padding:0 0 16px 174px;display:none;flex-direction:column;gap:8px}
  .factor.open .factor-body{display:flex}
  .factor-body .why-row{font-size:13.5px}

  /* why we recommend */
  .why-block{margin-bottom:20px}
  .why-block:last-child{margin-bottom:0}
  .why-block .wt{font-size:12.5px;font-weight:700;letter-spacing:.03em;color:var(--muted);
    margin-bottom:12px;text-transform:uppercase}
  .why-list{display:flex;flex-direction:column;gap:11px}
  .why-item{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;line-height:1.45}
  .why-item .ic{flex:0 0 auto;margin-top:1px}
  .why-item .yr{color:var(--muted);font-weight:500}
  .why-item .src{font-size:11.5px;color:var(--muted-2);margin-top:2px}

  .apply-note{background:var(--slate-bg);border-radius:11px;padding:13px 15px;font-size:13px;
    line-height:1.55;color:var(--ink)}
  .badge-ref{background:var(--slate-bg);color:var(--slate);border:1px solid var(--line)}
  /* ---- munkaterület-váltó ---- */
  .ws-switch{display:flex;gap:3px;background:rgba(255,255,255,.07);border-radius:10px;padding:3px;margin:14px 0 4px}
  .ws-switch button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 6px;font:inherit;
    font-size:12.5px;font-weight:500;color:#8A98AC;cursor:pointer;display:flex;align-items:center;
    justify-content:center;gap:6px}
  .ws-switch button .ic{width:14px;height:14px;display:inline-flex}
  .ws-switch button.on{background:#fff;color:var(--ink)}
  .ws-switch button:not(.on):hover{color:#fff}
  .ws-note{font-size:11px;color:#8A98AC;padding:0 4px 6px;line-height:1.45}

  /* ---- fiókblokk a sávban ---- */
  .rail-acct{border-top:1px solid rgba(255,255,255,.1);padding-top:13px;margin-top:8px;
    display:flex;align-items:center;gap:10px}
  .rail-acct .av{width:34px;height:34px;border-radius:9px;background:var(--gold);color:#1c1403;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--display);flex:0 0 34px}
  .rail-acct .who{min-width:0;flex:1;cursor:pointer}
  .rail-acct .who b{color:#fff;font-weight:600;display:block;font-size:13px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail-acct .who span{color:#8A98AC;font-size:11.5px;display:block;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail-out{flex:none;width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.14);
    background:transparent;color:#C6D0DD;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:7px}
  .rail-out:hover{background:rgba(202,74,74,.16);border-color:var(--red);color:#fff}

  /* ---- admin áttekintő ---- */
  .adm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:18px}
  .adm-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .adm-card h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:0 0 12px;font-weight:600}
  .adm-row{display:flex;justify-content:space-between;gap:10px;align-items:center;
    padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .adm-row:last-child{border-bottom:0}
  .adm-row .who b{display:block;font-weight:600}
  .adm-row .who small{color:var(--muted);font-size:12px}
  .adm-empty{color:var(--muted);font-size:13px;padding:10px 0}
  .adm-attention{border-color:var(--gold)}
  .adm-attention h3{color:var(--gold-deep)}
  .sys-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
    border-bottom:1px solid var(--line);font-size:13px}
  .sys-row:last-child{border-bottom:0}
  .sys-row span{color:var(--muted)}
  .sys-row b{font-weight:600;text-align:right}
  .plan-chip{display:inline-flex;align-items:center;gap:6px;background:var(--slate-bg);border-radius:99px;
    padding:4px 11px;font-size:12.5px;margin:0 6px 6px 0}
  .plan-chip b{font-weight:600}
  /* ---- belépés / regisztráció ---- */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px;background:var(--ink)}
  .auth-card{background:#fff;border-radius:20px;padding:32px 30px;width:100%;max-width:430px;
    box-shadow:0 22px 60px rgba(0,0,0,.3)}
  .auth-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .auth-card h1{font-size:23px;margin:18px 0 5px;letter-spacing:-.02em}
  .auth-card .sub{color:var(--muted);font-size:13.5px;margin-bottom:22px;line-height:1.5}
  .auth-tabs{display:flex;gap:6px;background:var(--slate-bg);border-radius:11px;padding:4px;margin-bottom:20px}
  .auth-tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px;font:inherit;
    font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer}
  .auth-tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(14,23,38,.1)}
  .auth-err{background:var(--red-bg);color:var(--red);border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:14px}
  .auth-ok{background:var(--green-bg);color:var(--green);border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:14px}
  .auth-foot{margin-top:18px;text-align:center;font-size:12.5px;color:var(--muted)}
  .auth-hint{margin-top:16px;background:var(--gold-bg);border:1px solid var(--gold);border-radius:11px;
    padding:11px 13px;font-size:12.5px;color:var(--gold-deep);line-height:1.55}
  .auth-hint b{font-family:var(--mono,monospace)}

  /* ---- előfizetés / zárolt tartalom ---- */
  .sub-badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:600}
  .sub-active{background:var(--green-bg);color:var(--green)}
  .sub-none{background:var(--slate-bg);color:var(--slate)}
  .sub-trial{background:var(--gold-bg);color:var(--gold-deep)}
  .locked-card{display:flex;align-items:center;gap:14px;background:#fff;border:1px dashed var(--line);
    border-radius:14px;padding:16px 18px;color:var(--muted)}
  .locked-card .lk{width:34px;height:34px;border-radius:10px;background:var(--slate-bg);
    display:flex;align-items:center;justify-content:center;color:var(--slate);flex:none}
  .locked-card b{color:var(--ink);font-size:14px;display:block}
  .locked-card small{font-size:12px}
  .upsell{background:linear-gradient(135deg,var(--ink),#1b2942);color:#fff;border-radius:16px;
    padding:24px 26px;margin:18px 0;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .upsell h3{font-size:18px;margin:0 0 6px;color:#fff}
  .upsell p{margin:0;color:#B9C4D4;font-size:13.5px;line-height:1.55;max-width:52ch}
  .upsell .btn{flex:none}

  /* ---- admin ---- */
  .admin-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
  .admin-stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 16px}
  .admin-stat .n{font-family:var(--display);font-size:26px;font-weight:600;line-height:1}
  .admin-stat .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:5px}
  .utable{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .utable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    padding:11px 13px;border-bottom:1px solid var(--line);font-weight:600;background:var(--slate-bg)}
  .utable td{padding:12px 13px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  .utable tr:last-child td{border-bottom:0}
  .utable .uname{font-weight:600}
  .utable .uco{font-size:12px;color:var(--muted)}
  .utable-wrap{overflow-x:auto}
  .grant-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .grant-row select,.grant-row input{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:12.5px;background:#fff}
  .btn-xs{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font:inherit;
    font-size:12.5px;cursor:pointer;color:var(--ink);white-space:nowrap}
  .btn-xs:hover{border-color:var(--gold);color:var(--gold-deep)}
  .btn-xs.danger:hover{border-color:var(--red);color:var(--red)}
  .btn-xs.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn-xs.primary:hover{background:#1b2942;color:#fff}

  /* ---- CRM ----
     Az ügyfélkapcsolat képernyői. A tábla vízszintesen görgethető, a kártyák
     mobilon egymás alá rendeződnek, és minden szám a szerverről jön — a
     felület nem számol ki semmit, amit ne tudna megindokolni. */
  .crm-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 18px}
  .crm-tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;
    font:inherit;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
  .crm-tabs button:hover{border-color:var(--gold);color:var(--gold-deep)}
  .crm-tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .crm-tabs button .c{font-size:11.5px;opacity:.7;margin-left:5px}

  .crm-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 16px}
  .kpi .n{font-family:var(--display);font-size:25px;font-weight:600;line-height:1.05;letter-spacing:-.01em}
  .kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
  .kpi .s{font-size:12px;color:var(--muted-2);margin-top:5px;line-height:1.4}
  .kpi.gold .n{color:var(--gold-deep)}
  .kpi.green .n{color:var(--green)}
  .kpi.amber .n{color:var(--amber)}

  .crm-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .crm-toolbar input[type=search],.crm-toolbar input[type=text],.crm-toolbar select{
    border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:inherit;font-size:13px;background:#fff;color:var(--text)}
  .crm-toolbar input[type=search]{flex:1;min-width:160px}
  .crm-toolbar .spacer{flex:1}

  .board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
  .board-col{flex:0 0 264px;min-width:264px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:14px;padding:11px;scroll-snap-align:start;display:flex;flex-direction:column;gap:9px}
  .board-col.drop{border-color:var(--gold);background:var(--gold-bg)}
  .board-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:1px 3px 8px;
    border-bottom:1px solid var(--line)}
  .board-head b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .board-head .n{font-family:var(--display);font-size:15px;font-weight:600}
  .board-empty{font-size:12.5px;color:var(--muted-2);padding:12px 4px;text-align:center}

  .ccard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;
    display:block;width:100%;text-align:left;font:inherit;color:inherit}
  .ccard:hover{border-color:var(--gold);box-shadow:0 2px 10px rgba(14,23,38,.06)}
  .ccard[draggable=true]{cursor:grab}
  .ccard.dragging{opacity:.45}
  .ccard .co{font-weight:600;font-size:13.5px;line-height:1.3;display:block}
  .ccard .who{font-size:12px;color:var(--muted);margin-top:2px;display:block;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ccard .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:9px}
  .ccard .next{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:flex-start;line-height:1.35}
  .ccard .next.due{color:var(--red)}
  .ccard .next .ic{flex:none;width:13px;height:13px;margin-top:1px}
  .ccard .stage-pick{margin-top:9px;width:100%;border:1px solid var(--line);border-radius:8px;
    padding:5px 8px;font:inherit;font-size:12px;background:#fff;color:var(--muted)}

  .life{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;
    padding:3px 8px;letter-spacing:.02em;white-space:nowrap}
  .life-lead{background:var(--slate-bg);color:var(--muted)}
  .life-registered{background:var(--slate-bg);color:var(--muted)}
  .life-trial{background:var(--amber-bg);color:var(--amber)}
  .life-subscriber{background:var(--green-bg);color:var(--green)}
  .life-expired{background:var(--red-bg);color:var(--red)}

  .eng{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .eng .bar{width:42px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
  .eng .bar i{display:block;height:100%;border-radius:3px;background:var(--muted-2)}
  .eng.high .bar i{background:var(--green)}
  .eng.medium .bar i{background:var(--gold)}
  .eng.low .bar i{background:var(--amber)}

  .ctag{font-size:11px;background:var(--gold-bg);color:var(--gold-deep);border-radius:999px;padding:2px 8px;white-space:nowrap}
  .cstale{font-size:11px;color:var(--muted-2);white-space:nowrap}

  /* ---- kapcsolat részletei ---- */
  .c360{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
  .c360-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
  .c360-head .av{width:46px;height:46px;border-radius:13px;background:var(--ink);color:#fff;flex:none;
    display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:17px}
  .c360-head h1{margin:0;font-size:24px;line-height:1.2}
  .c360-head .sub{font-size:13px;color:var(--muted);margin-top:4px}
  .c360-head .acts{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}

  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
  .fact{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
  .fact .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .fact .v{font-size:14px;font-weight:600;margin-top:3px;word-break:break-word}

  .note-form{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .note-form textarea{border:1px solid var(--line);border-radius:11px;padding:10px 12px;font:inherit;
    font-size:13.5px;min-height:74px;resize:vertical;background:#fff;color:var(--text);width:100%;box-sizing:border-box}
  .note-form .row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .note-form select,.note-form input{border:1px solid var(--line);border-radius:9px;padding:7px 10px;
    font:inherit;font-size:12.5px;background:#fff;color:var(--text)}

  .notes{display:flex;flex-direction:column;gap:10px}
  .note{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .note .nh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
  .note .nk{font-weight:600;color:var(--gold-deep);text-transform:uppercase;letter-spacing:.05em}
  .note .nb{margin-top:6px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .note .nx{margin-left:auto;border:0;background:none;color:var(--muted-2);cursor:pointer;font:inherit;font-size:12px;padding:0}
  .note .nx:hover{color:var(--red)}

  .tasks{display:flex;flex-direction:column;gap:7px}
  .task{display:flex;gap:9px;align-items:flex-start;background:#fff;border:1px solid var(--line);
    border-radius:11px;padding:9px 11px}
  .task.done{opacity:.55}
  .task.due{border-color:var(--red)}
  .task .tk{flex:1;min-width:0}
  .task .tt{font-size:13.5px;line-height:1.4;word-break:break-word}
  .task.done .tt{text-decoration:line-through}
  .task .td{font-size:11.5px;color:var(--muted);margin-top:2px}
  .task .td.late{color:var(--red);font-weight:600}
  .task input[type=checkbox]{margin-top:3px;flex:none;width:15px;height:15px;accent-color:var(--green)}

  .tl{display:flex;flex-direction:column;gap:0}
  .tl-item{display:grid;grid-template-columns:14px minmax(0,1fr);gap:11px;padding:0 0 14px}
  .tl-dot{width:9px;height:9px;border-radius:50%;background:var(--line-strong);margin:5px 0 0 2px;
    box-shadow:0 0 0 3px var(--surface-2)}
  .tl-item.k-note .tl-dot{background:var(--gold)}
  .tl-item.k-subscription .tl-dot{background:var(--green)}
  .tl-item.k-profile .tl-dot{background:var(--ink-3)}
  .tl-item.k-task .tl-dot{background:var(--amber)}
  .tl-body{min-width:0}
  .tl-when{font-size:11.5px;color:var(--muted-2)}
  .tl-what{font-size:13.5px;margin-top:1px;line-height:1.45;word-break:break-word}
  .tl-what b{font-weight:600}
  .tl-more{font-size:12.5px;color:var(--muted);margin-top:2px;word-break:break-word}

  /* ---- egyszerű, adatvezérelt diagramok ---- */
  .chart{width:100%;height:auto;display:block;overflow:visible}
  .chart-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:9px}
  .chart-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .funnel{display:flex;flex-direction:column;gap:8px}
  .funnel-row{display:grid;grid-template-columns:minmax(96px,auto) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
  .funnel-row .fb{height:20px;border-radius:5px;background:var(--gold-bg);overflow:hidden}
  .funnel-row .fb i{display:block;height:100%;background:var(--gold);border-radius:5px}
  .funnel-row .fn{font-family:var(--display);font-weight:600;font-size:14px;text-align:right;min-width:34px}

  /* ---- érdeklődő rögzítése az ingyenes felmérés végén ---- */
  .lead-box{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:16px 17px;margin-top:18px}
  .lead-box h3{margin:0 0 4px;font-size:15px}
  .lead-box p{margin:0 0 12px;font-size:12.5px;color:var(--muted);line-height:1.5}
  .lead-box .fields{display:flex;flex-direction:column;gap:8px}
  .lead-box input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;
    font-size:13.5px;background:#fff;color:var(--text);width:100%;box-sizing:border-box}
  .lead-box label.consent{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);
    line-height:1.45;cursor:pointer}
  .lead-box label.consent input{width:15px;height:15px;flex:none;margin-top:1px;accent-color:var(--gold)}
  .lead-done{background:var(--green-bg);border:1px solid var(--green);border-radius:14px;padding:15px 17px;
    margin-top:18px;font-size:13.5px;color:var(--green);line-height:1.5}

  @media(max-width:900px){
    .c360{grid-template-columns:1fr}
    .board-col{flex-basis:236px;min-width:236px}
    .c360-head .acts{margin-left:0;width:100%}
  }
  @media(max-width:520px){
    .crm-kpis{grid-template-columns:repeat(auto-fit,minmax(126px,1fr))}
    .board-col{flex-basis:212px;min-width:212px}
    .funnel-row{grid-template-columns:minmax(78px,auto) minmax(0,1fr) auto;font-size:12px}
  }

  /* ---- előzmények ---- */
  .hist{display:flex;flex-direction:column;gap:10px}
  .hist-item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 16px}
  .hist-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .hist-head b{font-size:14px}
  .hist-head span{font-size:12px;color:var(--muted)}
  .hist-changes{margin-top:9px;display:flex;flex-direction:column;gap:5px}
  .hist-change{font-size:12.5px;color:var(--ink);display:flex;gap:7px;flex-wrap:wrap}
  .hist-change .f{color:var(--muted);min-width:130px}
  .hist-change .from{color:var(--red);text-decoration:line-through}
  .hist-change .to{color:var(--green);font-weight:500}
  .act-list{display:flex;flex-direction:column;gap:6px}
  .act{display:flex;gap:10px;align-items:baseline;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line)}
  .act:last-child{border-bottom:0}
  .act .t{color:var(--muted);flex:none;min-width:118px}
  .act .k{font-weight:500}
  /* ---- beadási linkek ---- */
  .apply-links{display:flex;flex-direction:column;gap:9px}
  .apply-link{display:flex;gap:12px;align-items:center;padding:13px 15px;border:1px solid var(--line);
    border-radius:12px;text-decoration:none;color:var(--ink);background:#fff;transition:border-color .15s,background .15s}
  .apply-link:hover{border-color:var(--gold);background:var(--gold-bg)}
  .apply-link.primary{border-color:var(--gold);background:var(--gold-bg)}
  .apply-link .al-ic{flex:none;width:30px;height:30px;border-radius:9px;background:var(--slate-bg);
    display:flex;align-items:center;justify-content:center;color:var(--gold-deep)}
  .apply-link.primary .al-ic{background:#fff}
  .apply-link .al-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .apply-link .al-txt b{font-size:14px;font-weight:600}
  .apply-link .al-txt small{font-size:12px;color:var(--muted)}
  .card-ext{color:var(--muted);display:inline-flex;padding:4px;border-radius:7px;line-height:0}
  .card-ext:hover{color:var(--gold-deep);background:var(--gold-bg)}
  /* ---- keresés ---- */
  .search-bar{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);
    border-radius:14px;padding:10px 14px;box-shadow:0 1px 2px rgba(14,23,38,.04)}
  .search-bar:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,154,43,.14)}
  .search-bar .sic{width:20px;height:20px;color:var(--muted);flex:none}
  .search-bar input{flex:1;border:0;outline:0;font:inherit;font-size:15px;background:transparent;color:var(--ink);min-width:0}
  .search-bar button.go{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:9px 16px;
    font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;flex:none}
  .search-bar button.go:hover{background:#1b2942}
  .search-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:14px 0 6px}
  .search-meta .cnt{font-size:13.5px;color:var(--muted)}
  .search-meta .cnt b{color:var(--ink)}
  .search-sort{display:flex;gap:6px;flex-wrap:wrap}
  .search-sort button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;
    font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}
  .search-sort button.on{border-color:var(--ink);background:var(--ink);color:#fff}
  .facets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:14px 0 4px}
  .facet{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 14px}
  .facet h4{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 9px;font-weight:600}
  .facet .fopts{display:flex;flex-wrap:wrap;gap:6px}
  .facet .fo{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font-size:12.5px;
    color:var(--ink);cursor:pointer;font:inherit;display:inline-flex;gap:6px;align-items:center}
  .facet .fo .n{color:var(--muted);font-size:11.5px}
  .facet .fo.on{border-color:var(--gold);background:var(--gold-bg);color:var(--gold-deep);font-weight:500}
  .facet .fo.on .n{color:var(--gold-deep)}
  .facet .fo:hover{border-color:var(--gold)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 2px}
  .chip-f{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:99px;
    padding:4px 6px 4px 11px;font-size:12.5px}
  .chip-f button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:99px;width:17px;height:17px;
    line-height:1;cursor:pointer;font-size:12px;padding:0}
  .search-empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:34px 22px;text-align:center;color:var(--muted)}
  .search-empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:20px 0 4px}
  .pager button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;font:inherit;
    font-size:13px;cursor:pointer;color:var(--ink)}
  .pager button:disabled{opacity:.4;cursor:default}
  .pager .pinfo{font-size:13px;color:var(--muted)}
  .src-line{font-size:11.5px;color:var(--muted);margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .src-line a{color:var(--gold-deep);text-decoration:none}
  .src-line a:hover{text-decoration:underline}
  .quiz-inline{background:var(--slate-bg);border-radius:11px;padding:14px 16px;margin-top:4px}
  .quiz-inline .q{font-size:13.5px;font-weight:500;margin-bottom:10px}
  .quiz-inline .opts{display:flex;gap:8px;flex-wrap:wrap}

  /* calculator */
  .calc{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .calc-in label{font-size:13px;color:var(--muted);display:block;margin-bottom:7px}
  .calc-out{background:var(--ink);color:#fff;border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;justify-content:center;gap:14px}
  .calc-out .row{display:flex;justify-content:space-between;align-items:baseline}
  .calc-out .row .k{color:#9DAABB;font-size:13.5px}
  .calc-out .row .v{font-family:var(--display);font-weight:700;font-size:22px}
  .calc-out .row.support .v{color:var(--gold)}
  .calc-out hr{border:none;border-top:1px solid rgba(255,255,255,.12);margin:2px 0}

  .docs-list{display:flex;flex-direction:column;gap:9px}
  .doc-item{display:flex;align-items:center;gap:11px;font-size:14.5px;padding:10px 0;border-bottom:1px solid var(--line)}
  .doc-item:last-child{border-bottom:none}

  .detail-actions{display:flex;gap:12px;position:sticky;bottom:18px;background:#fff;
    border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-lg);margin-top:8px}
  .source-note{font-size:12px;color:var(--muted);margin-top:14px;display:flex;gap:7px;align-items:flex-start}

  .not-elig{background:var(--red-bg);border:1px solid #F0C9C9;border-radius:var(--radius);padding:20px 22px;margin-bottom:20px}
  .not-elig h3{color:var(--red);font-size:16px;margin-bottom:6px}

  /* inputs */
  .field{margin-bottom:18px}
  .field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px}
  .field label .opt{font-weight:400;color:var(--muted-2);font-size:12.5px}
  input[type=text],input[type=email],input[type=number],input[type=password],select{
    width:100%;padding:12px 14px;border:1px solid var(--line-strong);border-radius:10px;
    font-family:inherit;font-size:15px;background:#fff;color:var(--text);transition:.14s}
  input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,154,43,.15)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px}

  .chip-grid{display:flex;flex-wrap:wrap;gap:9px}
  .chip{border:1px solid var(--line-strong);border-radius:100px;padding:9px 15px;font-size:14px;
    font-weight:500;transition:.14s;background:#fff;user-select:none}
  .chip:hover{border-color:var(--ink)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.on.gold{background:var(--gold);color:#1c1403;border-color:var(--gold)}

  .pill-opt{border:1px solid var(--line-strong);border-radius:9px;padding:8px 13px;font-size:13.5px;
    font-weight:500;background:#fff;transition:.14s}
  .pill-opt:hover{border-color:var(--ink)}
  .pill-opt.on{background:var(--green);color:#fff;border-color:var(--green)}
  .pill-opt.no{background:var(--red);color:#fff;border-color:var(--red)}

  /* onboarding / assessment */
  .ob{max-width:600px;margin:0 auto;padding:40px 24px 80px}
  .ob-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
  .ob-progress{height:6px;background:var(--line);border-radius:100px;overflow:hidden;margin-bottom:36px}
  .ob-progress i{display:block;height:100%;background:var(--gold);border-radius:100px;transition:.4s ease}
  .ob-step-lbl{font-size:13px;font-weight:600;color:var(--gold-deep);margin-bottom:8px}
  .ob h1{font-size:27px;letter-spacing:-.02em;margin-bottom:8px}
  .ob .ob-sub{color:var(--muted);font-size:15.5px;margin-bottom:28px}
  .ob-actions{display:flex;gap:12px;margin-top:32px}
  .demo-banner{background:var(--gold-bg);border:1px solid #EDD9A9;border-radius:11px;
    padding:13px 16px;font-size:13.5px;display:flex;gap:11px;align-items:center;margin-bottom:26px;color:#7a5710}

  /* assessment result */
  .assess-result{text-align:center;padding:20px 0}
  .assess-ring{margin:0 auto 8px}
  .assess-result h1{font-size:30px;margin-bottom:10px}
  .teaser-opps{display:flex;flex-direction:column;gap:12px;margin:28px 0;text-align:left}
  .teaser-opp{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;
    display:flex;align-items:center;gap:16px}
  .teaser-opp .tscore{font-family:var(--display);font-weight:700;font-size:20px;color:var(--gold-deep);flex:0 0 auto}
  .teaser-opp .tbody{flex:1}
  .teaser-opp .tbody b{font-size:15px}
  .teaser-opp .tbody span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
  .teaser-opp.blur{filter:blur(4px);opacity:.6;pointer-events:none}
  .locked-hint{color:var(--muted);font-size:13.5px;margin-top:-6px}

  /* Zárolt találat: a pontszám és az összeg valós, a felhívás kiléte nincs a
     lapon. A kitakart sáv nem CSS-elhomályosítás — ott egyszerűen nincs adat. */
  .opp-teaser{cursor:default}
  .opp-teaser:hover{transform:none;box-shadow:var(--shadow)}
  .redact{display:inline-block;border-radius:4px;color:transparent;user-select:none;
    background:repeating-linear-gradient(135deg,var(--slate) 0 6px,#8A97A8 6px 12px);
    vertical-align:middle}
  .redact.r-title{height:15px;width:min(320px,72%)}
  .redact.r-prog{height:10px;width:min(190px,52%);opacity:.75}
  .teaser-money{font-family:var(--display);font-weight:700;color:var(--gold-deep)}
  .teaser-lock{display:inline-flex;align-items:center;gap:6px;color:var(--gold-deep);
    font-size:12.5px;font-weight:600;white-space:nowrap}
  .teaser-note{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;
    background:var(--slate-bg);border-radius:10px;padding:10px 14px;margin:12px 0 18px}

  /* toast */
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--ink);color:#fff;padding:14px 20px;border-radius:12px;font-size:14px;font-weight:500;
    box-shadow:var(--shadow-lg);z-index:200;opacity:0;transition:.3s;display:flex;gap:10px;align-items:center}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  /* upgrade modal */
  .modal-bg{position:fixed;inset:0;background:rgba(14,23,38,.55);z-index:150;display:flex;
    align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.2s}
  .modal-bg.show{opacity:1;pointer-events:auto}
  .modal{background:#fff;border-radius:var(--radius-lg);max-width:460px;width:100%;padding:34px;
    box-shadow:var(--shadow-lg);transform:translateY(12px);transition:.24s}
  .modal-bg.show .modal{transform:translateY(0)}
  .modal .plus-badge{display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:var(--gold);
    font-weight:700;font-size:12px;padding:6px 12px;border-radius:100px;letter-spacing:.04em;margin-bottom:18px}
  .modal h2{font-size:24px;margin-bottom:10px}
  .modal p{color:var(--muted);margin-bottom:18px;font-size:15px}
  .modal ul{list-style:none;padding:0;margin:0 0 24px;display:flex;flex-direction:column;gap:11px}
  .modal li{display:flex;gap:10px;font-size:14.5px;align-items:flex-start}

  /* mobile nav */
  .mnav{display:none}
  .mobile-app-lang{display:none}
  .mobile-ws{display:none}
  @media(max-width:900px){
    .mobile-app-lang{display:block;position:fixed;top:12px;right:12px;z-index:90;
      background:rgba(255,255,255,.94);border-radius:100px;padding:2px;backdrop-filter:blur(6px);
      box-shadow:0 2px 10px rgba(16,23,38,.12)}
    .mobile-ws{display:inline-flex;align-items:center;gap:7px;position:fixed;top:12px;left:12px;z-index:90;
      background:rgba(255,255,255,.94);border:0;border-radius:100px;padding:7px 14px 7px 11px;
      font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;
      backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(16,23,38,.12)}
    .mobile-ws .ic{width:15px;height:15px;display:inline-flex;color:var(--gold-deep)}
  }

  @media(max-width:900px){
    .hero{grid-template-columns:1fr;gap:36px;padding-top:20px}
    .hero h1{font-size:38px}
    .preview{transform:none;max-width:420px}
    .compare,.steps3,.price-teaser,.calc,.detail-hero{grid-template-columns:1fr}
    .price-teaser{padding:30px}
    .section h2{font-size:27px}
    .nav-links{display:none}
    .shell{grid-template-columns:1fr}
    .rail{display:none}
    .main{padding:22px 18px 96px}
    .stats{grid-template-columns:1fr 1fr}
    .opp{grid-template-columns:52px 1fr;gap:14px}
    .opp-right{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;
      border-top:1px solid var(--line);padding-top:12px}
    .detail-hero{padding:24px}
    .factor-head .fname{flex-basis:auto}
    .factor-body{padding-left:0}
    .cal-month{grid-template-columns:1fr;gap:10px}
    .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
      z-index:100;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
    .mnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;
      color:var(--muted);font-weight:600;padding:6px 0}
    .mnav button.active{color:var(--gold-deep)}
    .mnav .ic{width:22px;height:22px}
    .ob{padding-top:20px}
  }
  @media(max-width:520px){
    .hero h1{font-size:32px}
    .stats{grid-template-columns:1fr 1fr}
    .main{padding:18px 14px 96px}
  }

  /* ---- valódi fotó a hero-ban ---- */
  .hero-visual{position:relative;animation:heroIn .8s .1s cubic-bezier(.2,.7,.2,1) both}
  @keyframes heroIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  .hero-photo{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:740/452;
    box-shadow:0 30px 60px -24px rgba(0,0,0,.6), 0 2px 0 rgba(255,255,255,.04) inset}
  .hero-photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.02) contrast(1.02)}
  .hero-photo::after{content:"";position:absolute;inset:0;
    background:linear-gradient(205deg, rgba(14,23,38,0) 42%, rgba(14,23,38,.5) 100%)}
  .hero-photo::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;border-radius:20px}
  .hero-card-float{position:absolute;right:-16px;bottom:-30px;width:264px;max-width:74%;z-index:2;
    animation:floatIn 1s .55s cubic-bezier(.2,.7,.2,1) both}
  .hero-card-float .preview{transform:none;padding:15px}
  .hero-card-float .preview::before{display:none}
  .hero-card-float .preview h3{font-size:15px}
  .hero-card-float .preview .preview-foot{font-size:11.5px}
  .hero-card-float .why-row{font-size:12.5px}
  @keyframes floatIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

  /* ---- nyelvváltó ---- */
  .lang-sw{display:inline-flex;border:1px solid var(--line-strong);border-radius:100px;overflow:hidden;flex:0 0 auto}
  .lang-sw button{padding:6px 12px;font-size:12.5px;font-weight:700;letter-spacing:.03em;color:var(--muted);background:transparent;transition:.15s}
  .lang-sw button.on{background:var(--ink);color:#fff}
  .lang-sw button:hover:not(.on){color:var(--text)}
  .lang-sw.dark{border-color:rgba(255,255,255,.22)}
  .lang-sw.dark button{color:#AEBACB}
  .lang-sw.dark button.on{background:var(--gold);color:#1c1403}
  .lang-sw.dark button:hover:not(.on){color:#fff}
  .rail-lang{padding:0 8px 12px}


  /* ---- scroll reveal ---- */
  [data-reveal]{opacity:0;transform:translateY(20px);transition:opacity .65s cubic-bezier(.2,.7,.2,1),transform .65s cubic-bezier(.2,.7,.2,1)}
  [data-reveal].in{opacity:1;transform:none}

  /* ---- gyűrű feltöltődés ---- */
  @keyframes ringfill{from{stroke-dashoffset:var(--from)}}

  /* ---- dashboard belépő stagger ---- */
  .opp-grid.stagger .opp{animation:oppIn .5s cubic-bezier(.2,.7,.2,1) both}
  .opp-grid.stagger .opp:nth-child(1){animation-delay:.04s}
  .opp-grid.stagger .opp:nth-child(2){animation-delay:.10s}
  .opp-grid.stagger .opp:nth-child(3){animation-delay:.16s}
  .opp-grid.stagger .opp:nth-child(4){animation-delay:.22s}
  .opp-grid.stagger .opp:nth-child(5){animation-delay:.28s}
  .opp-grid.stagger .opp:nth-child(n+6){animation-delay:.34s}
  @keyframes oppIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .stats.stagger .stat{animation:oppIn .5s cubic-bezier(.2,.7,.2,1) both}

  /* ---- betöltő overlay (matching fut) ---- */
  .loader-ov{position:fixed;inset:0;background:var(--ink);z-index:300;display:flex;align-items:center;
    justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
  .loader-ov.show{opacity:1;pointer-events:auto}
  .loader-card{width:min(430px,90vw);color:#EAF0F7;text-align:center;padding:24px}
  .loader-target{width:82px;height:82px;margin:0 auto 30px;position:relative;display:flex;align-items:center;justify-content:center}
  .loader-target .ring{position:absolute;inset:0;border:2px solid var(--gold);border-radius:50%;animation:lpulse 1.8s ease-out infinite}
  .loader-target .ring:nth-child(2){animation-delay:.6s}
  .loader-target .ring:nth-child(3){animation-delay:1.2s}
  @keyframes lpulse{0%{transform:scale(.42);opacity:.85}100%{transform:scale(1.18);opacity:0}}
  .loader-target .core{width:30px;height:30px}
  .loader-title{font-family:var(--display);font-weight:600;font-size:20px;margin-bottom:22px;letter-spacing:-.01em}
  .loader-steps{display:flex;flex-direction:column;gap:12px;text-align:left;max-width:290px;margin:0 auto}
  .lstep{display:flex;align-items:center;gap:12px;font-size:14px;color:#6D7B90;transition:color .3s}
  .lstep.active{color:#EAF0F7}
  .lstep.done{color:#9DAABB}
  .lstep .ld{width:18px;height:18px;flex:0 0 18px;border-radius:50%;border:2px solid rgba(255,255,255,.16);
    position:relative;transition:.3s}
  .lstep.active .ld{border-color:var(--gold);box-shadow:0 0 0 4px rgba(217,154,43,.16)}
  .lstep.done .ld{background:var(--gold);border-color:var(--gold)}
  .lstep.done .ld::after{content:"";position:absolute;left:4.5px;top:1.5px;width:5px;height:9px;
    border:solid #1c1403;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .loader-bar{height:6px;background:rgba(255,255,255,.1);border-radius:100px;overflow:hidden;margin-top:26px}
  .loader-bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:100px}

  @media(max-width:900px){
    .hero-card-float{position:static;width:100%;max-width:420px;margin:16px auto 0}
    .hero-photo{aspect-ratio:16/10}
  }
  @media(max-width:900px){
    .btn{white-space:normal}
    .detail-actions{position:sticky;bottom:calc(82px + env(safe-area-inset-bottom));margin-top:14px}
    .section-title{flex-direction:column;align-items:flex-start;gap:8px}
    .toast{max-width:calc(100vw - 28px);text-align:center}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
  @media(prefers-reduced-motion:reduce){[data-reveal]{opacity:1 !important;transform:none !important}}
</style>

<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modal"></div>
<div class="loader-ov" id="loader"></div>

<script>
"use strict";
/* =========================================================================
   HUNTER MVP — front-end prototípus
   A spec szerint: Eligibility Engine (determinisztikus), Hunter Score (5 faktor),
   AI Explainability, Funding Calendar, támogatáskalkulátor, Hunter Plus belépő.
   ========================================================================= */

let TODAY = new Date();   // a katalógus referencia-dátuma felülírja (/api/meta)

/* ===================== i18n =====================
   TR maps Hungarian source strings -> English.

function L(s){
  if(state.lang!=="en" || s===undefined || s===null) return s;
  const v=TR[s];
  return v!==undefined ? v : s;
}
function LX(hu,en){ return state.lang==="en" ? en : hu; }
function setLang(l){
  if(state.lang===l) return;
  state.lang=l;
  document.documentElement.lang = l;
  render();
}
function langToggle(dark){
  const on=(l)=>state.lang===l;
  return `<div class="lang-sw ${dark?"dark":""}">
    <button class="${on("hu")?"on":""}" onclick="setLang('hu')">HU</button>
    <button class="${on("en")?"on":""}" onclick="setLang('en')">EN</button>
  </div>`;
}

/* =========================================================================
   ELIGIBILITY ENGINE (determinisztikus, szabályalapú)
   ========================================================================= */
function getField(profile, field, oppId){
  // ad-hoc válasz felülírja a profilt (INSUFFICIENT_DATA feloldás)
  const key = oppId+":"+field;
  if(state.answers[key]!==undefined) return state.answers[key];
  // Egy felhívás nélkül megadott válasz minden felhívásra érvényes — a
  // konzorciumi készséget vagy a de minimis keretet nem kérdezzük meg
  // felhívásonként újra.
  if(state.answers[field]!==undefined) return state.answers[field];
  return profile ? profile[field] : undefined;
}
function ruleLabel(rule){
  if(!rule) return "";
  if(state.lang==="en") return rule.label_en || rule.label || rule.label_hu || "";
  return rule.label_hu || rule.label || rule.label_en || "";
}
function quizText(quiz){
  if(!quiz) return "";
  return state.lang==="en" ? (quiz.q_en || quiz.q || "") : (quiz.q_hu || quiz.q || "");
}
function quizOptText(opt){
  return state.lang==="en" ? (opt.t_en || opt.t || "") : (opt.t_hu || opt.t || "");
}
function condText(c){
  if(c.text!==undefined) return c.text;
  return state.lang==="en" ? c.text_en : c.text_hu;
}
function checkRule(val, op, target){
  if(val===undefined || val===null) return "unknown";
  switch(op){
    case "between": return (val>=target[0] && val<=target[1]) ? "pass" : "fail";
    case "in": return target.includes(val) ? "pass" : "fail";
    case "not_in": return !target.includes(val) ? "pass" : "fail";
    case ">=": return val>=target ? "pass" : "fail";
    case "<=": return val<=target ? "pass" : "fail";
    case "==": return val===target ? "pass" : "fail";
    case "includes_any": return (Array.isArray(val)&&val.some(v=>target.includes(v))) ? "pass":"fail";
    default: return "unknown";
  }
}
function evaluateEligibility(opp, profile){
  const checks = opp.hard.map(rule=>{
    const val = getField(profile, rule.field, opp.id);
    return {rule, status:checkRule(val, rule.op, rule.value), value:val};
  });
  const anyFail = checks.some(c=>c.status==="fail");
  const anyUnknown = checks.some(c=>c.status==="unknown");
  // feltételes kockázatok (nem kizáró): önerő + közeli határidő
  const days = daysToDeadline(opp);
  const conditions=[];
  if(opp.intensity<1) conditions.push({type:"own", text:LX(`${Math.round((1-opp.intensity)*100)}% saját forrás szükséges`,`${Math.round((1-opp.intensity)*100)}% own contribution required`)});
  if(days>0 && days<=14) conditions.push({type:"deadline", text:LX(`Közeli határidő – ${days} nap van a beadásig`,`Deadline approaching – ${days} days left to submit`)});
  if(opp.highAdmin) conditions.push({type:"admin", text:LX("Magas adminisztrációs teher (angol nyelvű, összetett anyag)","High administrative burden (English-language, complex submission)")});
  if(opp.consortium && opp.consortium.required) conditions.push({type:"consortium",
    text:LX(`Konzorcium kell: min. ${opp.consortium.minPartners} partner, ${opp.consortium.minCountries} országból`,
            `Consortium required: at least ${opp.consortium.minPartners} partners from ${opp.consortium.minCountries} countries`)});
  if(opp.awardsFunding===false) conditions.push({type:"no_funding",
    text:LX("Ez a felhívás nem vissza nem térítendő támogatás (díj vagy minősítés)",
            "This call does not award a grant (it is a prize or a quality label)")});

  let status;
  if(anyFail) status="NOT_ELIGIBLE";
  else if(anyUnknown) status="INSUFFICIENT_DATA";
  else if(conditions.length) status="CONDITIONAL";
  else status="ELIGIBLE";
  return {status, checks, conditions, days};
}

/* =========================================================================
   HUNTER SCORE (5 faktor, spec szerinti súlyozás)
   Hunter Score = 0.35·Elig + 0.25·ProjectFit + 0.15·FundingSize + 0.15·Timing + 0.10·Feasibility
   ========================================================================= */
function factorEligibility(elig){
  const c=elig.checks; if(!c.length) return 1;
  let s=0; c.forEach(x=> s += x.status==="pass"?1 : x.status==="unknown"?0.7 : 0);
  return s/c.length;
}
function factorProjectFit(opp, profile){
  const goals = profile.goals||[];
  const overlap = opp.goals.filter(g=>goals.includes(g)).length;
  const goalScore = opp.goals.length ? overlap/opp.goals.length : 0;
  let softPass=0, softTot=0;
  (opp.soft||[]).forEach(r=>{ softTot+=r.weight;
    const val = r.field==="goals"?goals : getField(profile,r.field,opp.id);
    if(checkRule(val,r.op,r.value)==="pass") softPass+=r.weight;
  });
  const softScore = softTot? softPass/softTot : goalScore;
  let base = 0.6*goalScore + 0.4*softScore;
  // A tematikusan osztályozott (EU) felhívásoknál a téma dominál: enélkül a
  // nem-tematikus soft szabályok (forráspreferencia, szektor) önmagukban
  // közepes pontszámot adnának egy témájában teljesen idegen felhívásnak is.
  if(opp.goalScores){
    // Ha a felhívás teljes leírása alapján egyetlen céllal sem esik egybe, az
    // valódi nem-illeszkedés; ha a portál nem közölt leírást, az csak hiányzó
    // adat, és nem büntetjük érte a felhívást.
    const thematic = (opp.goals && opp.goals.length) ? goalScore : (opp.described ? 0.1 : 0.3);
    base = 0.8*thematic + 0.2*softScore;
  }
  if(opp.smeFit===undefined || !profile.orgType) return base;
  const instrumentFit = (profile.orgType==="sme"||profile.orgType==="large") ? opp.smeFit : 1;
  return base*(0.75+0.25*instrumentFit);
}
function factorFundingSize(opp, profile){
  const v = profile.investment_value||0;
  // Nem minden EU-s topic közöl támogatási sávot — ilyenkor semleges az érték.
  if(!opp.fundingMin && !opp.fundingMax) return 0.5;
  // Konzorciumi felhívásnál a cég a saját munkacsomagját tervezi, nem a teljes
  // projektet: a viszonyítás a becsült partneri részesedéshez történik.
  const lo = opp.partnerShare ? opp.partnerShare.minHuf : (opp.fundingMin||0);
  const hi = opp.partnerShare ? opp.partnerShare.maxHuf : (opp.fundingMax||opp.fundingMin);
  const support = Math.min(v*opp.intensity, hi);
  let band;
  if(v>=lo && v<=hi*2) band=1;
  else if(v<lo) band = lo? Math.max(.2, v/lo):0.5;
  else band = Math.max(.4, (hi*2)/v);
  const meaningful = support>=3e6 ? 1 : support/3e6;
  return Math.min(1, 0.7*band + 0.3*meaningful*(0.6+opp.intensity*0.4));
}
function factorTiming(opp){
  const d = daysToDeadline(opp);
  if(d<=0) return 0;
  if(d<14) return .45;
  if(d<45) return .72;
  if(d<120) return .92;
  if(d<=240) return 1;
  return .84;
}
function factorFeasibility(opp, profile){
  let f=1;
  f -= (1-opp.intensity)*0.4;
  f -= Math.min((opp.docs||[]).length,6)/6*0.28;
  if(opp.highAdmin) f-=0.18;
  if(opp.consortium && opp.consortium.required){
    const ready = profile && getField(profile,"consortium_ready",opp.id);
    if(ready===true) f-=0.04;
    else if(ready===false) f-=0.22;
    else f-=0.12;
  }
  if(opp.sourceSystem==="EU_FUNDING_TENDERS" && profile && profile.eu_experience===false) f-=0.06;
  return Math.max(0.2, f);
}
function hunterScore(opp, profile){
  const elig = evaluateEligibility(opp, profile);
  if(elig.status==="NOT_ELIGIBLE") return {elig, blocked:true};
  const f = {
    elig:factorEligibility(elig),
    fit:factorProjectFit(opp,profile),
    size:factorFundingSize(opp,profile),
    timing:factorTiming(opp),
    feas:factorFeasibility(opp,profile),
  };
  const raw = 0.35*f.elig + 0.25*f.fit + 0.15*f.size + 0.15*f.timing + 0.10*f.feas;
  const score = Math.round(raw*100);
  return {elig, blocked:false, score, factors:f, estimated:elig.status==="INSUFFICIENT_DATA"};
}
function scoreBand(s){
  if(s>=85) return {lbl:"Nagyon erős lehetőség", color:"var(--green)", key:"strong"};
  if(s>=70) return {lbl:"Releváns lehetőség", color:"var(--gold-deep)", key:"relevant"};
  if(s>=50) return {lbl:"Feltételes lehetőség", color:"var(--amber)", key:"conditional"};
  return {lbl:"Alacsony relevancia", color:"var(--slate)", key:"low"};
}

function daysToDeadline(opp){
  return Math.round((new Date(opp.deadline)-TODAY)/86400000);
}
function fmtHUF(n){
  const loc = state.lang==="en" ? "en-GB" : "hu-HU";
  if(n>=1e9) return (n/1e9).toLocaleString(loc,{maximumFractionDigits:1})+LX(" Mrd Ft"," bn HUF");
  return Math.round(n/1e6).toLocaleString(loc)+LX(" M Ft","M HUF");
}
function fmtDate(s){
  const d=new Date(s);
  if(state.lang==="en") return d.toLocaleDateString("en-GB",{year:"numeric",month:"short",day:"2-digit"});
  return d.toLocaleDateString("hu-HU",{year:"numeric",month:"2-digit",day:"2-digit"}).replace(/\s/g,"");
}
function oppStatus(opp){
  const d=daysToDeadline(opp);
  if(d<0) return {key:"closed", lbl:"Lezárt"};
  if(d<=14) return {key:"closing", lbl:"Hamarosan lejár"};
  return {key:"open", lbl:"Nyitva"};
}
// rangsorolt találatok az aktuális profilra
function rankedOpps(profile){
  return OPPS.map(o=>({opp:o, res:hunterScore(o,profile)}))
    .filter(x=>daysToDeadline(x.opp)>0)
    .sort((a,b)=>{
      if(a.res.blocked!==b.res.blocked) return a.res.blocked?1:-1;
      return (b.res.score||0)-(a.res.score||0);
    });
}

/* ---------------- ASSESSMENT (2 perces felmérés → readiness score) ---------------- */
const ASSESS_Q = [
  {id:"employees", q:"Hány főt foglalkoztat a céged?", type:"single",
   opts:[{t:"1–4 fő",v:3},{t:"5–15 fő",v:10},{t:"16–50 fő",v:30},{t:"51–250 fő",v:120}]},
  {id:"county", q:"Hol van a fő megvalósítási helyszínetek?", type:"region"},
  {id:"industryId", q:"Melyik iparág írja le legjobban a céget?", type:"industry"},
  {id:"closed_business_years", q:"Hány lezárt üzleti éved van?", type:"single",
   opts:[{t:"Még nincs",v:0},{t:"1 év",v:1},{t:"2 vagy több",v:3}]},
  {id:"goals", q:"Mit fejlesztenél a következő 12 hónapban?", type:"multi", src:"goals"},
  {id:"investment_value", q:"Mekkora a tervezett beruházás nagyságrendje?", type:"single",
   opts:[{t:"1–10 M Ft",v:6e6},{t:"10–30 M Ft",v:25e6},{t:"30–100 M Ft",v:60e6},{t:"100 M Ft felett",v:180e6}]},
];
function goAssess(){ state.screen="assess"; state.assess={step:0,answers:{}}; render(); }
function viewAssess(){
  const a=state.assess;
  if(a.step>=ASSESS_Q.length) return assessResult();
  const Q=ASSESS_Q[a.step];
  const pct=Math.round((a.step)/ASSESS_Q.length*100);
  let body="";
  if(Q.type==="single"){
    body=`<div class="chip-grid">${Q.opts.map(o=>{
      const on=a.answers[Q.id]===o.v?"on gold":"";
      return `<button class="chip ${on}" onclick='assessPick(${JSON.stringify(Q.id)},${JSON.stringify(o.v)})'>${L(o.t)}</button>`;
    }).join("")}</div>`;
  } else if(Q.type==="region"){
    const cur=a.answers.county;
    body=`<select onchange='assessPick("county",this.value)'><option value="">${L("Válassz megyét…")}</option>
      ${REGIONS.map(r=>r.counties.map(c=>`<option ${cur===c?"selected":""} value="${c}">${c}${r.code!=="HU11"&&r.name!==c?" ("+L(r.name)+")":""}</option>`).join("")).join("")}</select>`;
  } else if(Q.type==="industry"){
    body=`<div class="chip-grid">${INDUSTRIES.map(i=>{
      const on=a.answers.industryId===i.id?"on gold":"";
      return `<button class="chip ${on}" onclick='assessPick("industryId",${JSON.stringify(i.id)})'>${L(i.label)}</button>`;
    }).join("")}</div>`;
  } else if(Q.type==="multi"){
    const cur=a.answers.goals||[];
    body=`<div class="chip-grid">${GOALS.map(g=>{
      const on=cur.includes(g.id)?"on gold":"";
      return `<button class="chip ${on}" onclick='assessToggleGoal(${JSON.stringify(g.id)})'>${L(g.label)}</button>`;
    }).join("")}</div>`;
  }
  const canNext = Q.type==="multi" ? (a.answers.goals||[]).length>0
                : Q.type==="region" ? !!a.answers.county
                : a.answers[Q.id]!==undefined;
  return `<div class="ob">
    <div class="ob-top">${logoHTML(false)}<div style="display:flex;gap:10px;align-items:center">${langToggle(false)}<button class="btn btn-ghost btn-sm" onclick="backLanding()">${L("Mégse")}</button></div></div>
    <div class="ob-progress"><i style="width:${pct}%"></i></div>
    <div class="ob-step-lbl">${L("Ingyenes felmérés")} · ${a.step+1}/${ASSESS_Q.length} · ${LX("kb. 2 perc","approx. 2 min")}</div>
    <h1>${L(Q.q)}</h1>
    <p class="ob-sub">${L("Nincs regisztráció. A végén megkapod a Hunter Readiness Score-odat.")}</p>
    ${body}
    <div class="ob-actions">
      ${a.step>0?`<button class="btn btn-ghost" onclick="assessBack()">${L("Vissza")}</button>`:""}
      <button class="btn btn-gold" ${canNext?"":"disabled"} onclick="assessNext()">
        ${a.step===ASSESS_Q.length-1?L("Eredményem megnézése"):L("Következő")} ${IC.arrow}</button>
    </div>
  </div>`;
}
function assessPick(id,v){ state.assess.answers[id]=v; render(); }
function assessToggleGoal(g){
  const a=state.assess.answers; a.goals=a.goals||[];
  a.goals.includes(g)? a.goals=a.goals.filter(x=>x!==g) : a.goals.push(g);
  render();
}
/* A felmérés a saját profiljával kér kitakart sorokat: a látogatónak még
   nincs fiókja, így a szerver úgyis csak pontszámot és összeget ad vissza. */
async function loadAssessTeasers(){
  try{
    const d = await api.post("/api/catalog", { profile: buildProfileFromAssess(), answers:{}, saved:[] });
    state.assess.teasers  = d.teasers || [];
    state.assess.eligible = (d.stats && d.stats.eligible) || d.lockedTotal || 0;
  }catch(err){
    state.assess.teasers = [];
    state.assess.eligible = 0;
  }
}

function assessNext(){
  state.assess.step++;
  if(state.assess.step>=ASSESS_Q.length){
    const ready = Promise.all([loadCatalog(), loadAssessTeasers()]);
    showLoader(L("Kiértékeljük a válaszaidat"),
      ["Cégadatok feldolgozása","Élő felhívás-katalógus betöltése","Jogosultsági előszűrés","Readiness Score számítása","Illeszkedő irányok keresése"].map(L),
      ()=>ready.finally(()=>render()));
  } else render();
}
function assessBack(){ state.assess.step--; render(); }

function buildProfileFromAssess(){
  const a=state.assess.answers;
  const county=a.county||"Pest";
  const region=(REGIONS.find(r=>r.counties.includes(county))||{code:"HU12"}).code;
  return {
    company:"A céged", initials:"C",
    employees:a.employees||10, region, county,
    industryId:a.industryId||"services", teaor:TEAOR_OF(a.industryId||"services"),
    revBand:"100–500 M Ft", closed_business_years:a.closed_business_years,
    goals:a.goals||[], investment_value:a.investment_value||25e6,
    projectName:"Tervezett fejlesztés", funding_pref:["non_refundable","HU","EU"],
    de_minimis_ok:undefined,
    country:"HU",
    orgType:(a.employees||10)<=249?"sme":"large",
  };
}
function readinessScore(profile){
  // egyszerű 0–100 készültségi mutató
  let s=40;
  if(profile.employees>=5) s+=12;
  if(profile.employees>=16) s+=6;
  if(profile.closed_business_years>=1) s+=10;
  if(profile.closed_business_years>=2) s+=8;
  if((profile.goals||[]).length>0) s+=10;
  if(profile.investment_value>=10e6) s+=8;
  if(profile.region!=="HU11") s+=6;
  return Math.min(97, s);
}

          <circle cx="60" cy="60" r="54" fill="none" stroke="var(--gold)" stroke-width="11" stroke-linecap="round"
            stroke-dasharray="339.29" stroke-dashoffset="${off}" style="--from:339.29px;animation:ringfill 1.1s .2s cubic-bezier(.3,.7,.2,1) both"/></svg>
        <div class="center"><div class="bn">${rs}</div><div class="bt">/ 100</div></div>
      </div>
      <div class="band-lbl" style="color:var(--gold-deep)">Hunter Readiness Score — ${band}</div>
      <h1 style="margin-top:16px">${LX(`${eligible} felhívásra pályázhatsz`,`You qualify for ${eligible} calls`)}</h1>
      <p class="ob-sub" style="max-width:46ch;margin:8px auto 0">${LX(
        "A pontszámok és az összegek alul valósak — a te válaszaidra számoltuk. Hogy melyik felhívásról van szó, az az előfizetéssel derül ki.",
        "The scores and amounts below are real — computed from your answers. Which call each one is becomes visible with a subscription.")}</p>
    </div>
    <div class="teaser-opps">
      ${teasers.map(t=>`
        <div class="teaser-opp">
          <div class="tscore num">${t.score!=null?t.score:"—"}</div>
          <div class="tbody">
            <b><span class="redact r-title">redacted</span></b>
            <span>${t.grantHuf?L("Neked járó támogatás")+": "+fmtHUF(t.grantHuf):L("Támogatás: a felhívás nem közli")}${t.closingSoon?" · "+L("Hamarosan lejár"):""}</span>
          </div>
        </div>`).join("")}
    </div>
    <p class="locked-hint">${IC.lock} ${LX(
      "A felhívások neve, határideje és a beadási link az előfizetéssel oldódik fel.",
      "The call names, their deadlines and the submission links unlock with a subscription.")}</p>

      <button class="btn btn-gold btn-block" onclick='startFromAssess()'>${L("Megnézem a hozzáférési lehetőségeket")} ${IC.arrow}</button>

/* A felmérés eddig nyomtalanul zárult: a látogató válaszolt hat kérdésre,
   megnézte a pontszámát és elment. Ez az a pont, ahol meg lehet kérdezni, hogy
   keressük-e — és ha igen, a CRM-be az a kitöltés kerül, amit tényleg
   elküldött, nem egy üres lap. Hozzájárulás nélkül semmi nem megy el. */
function leadCaptureBlock(readiness, ranked){
  if(state.lead.sent){
    return `<div class="lead-done">${LX(
      "Köszönjük — rögzítettük a megkeresési kérésedet. Automatikus e-mail értesítést nem küldünk.",
      "Thank you — your follow-up request is recorded. No automatic email notification is sent.")}</div>`;
  }
  return `<div class="lead-box">
    <h3>${LX("Kérem, hogy keressenek meg","Ask us to get in touch")}</h3>
    <p>${LX(
      "Megnézzük a válaszaidat, és megírjuk, melyik nyitott felhívás jöhet szóba nálatok. Az adataidat csak ehhez használjuk, és bármikor kérheted a törlésüket.",
      "We will look at your answers and write back about which open calls could work for you. We use your details for this only, and you can ask us to delete them at any time.")}</p>
    <div class="fields">
      <input id="lead_email" type="email" inputmode="email" autocomplete="email" placeholder="${LX("E-mail cím","Email address")}">
      <input id="lead_company" type="text" autocomplete="organization" placeholder="${LX("Cégnév (nem kötelező)","Company (optional)")}">
      <input id="lead_name" type="text" autocomplete="name" placeholder="${LX("Kapcsolattartó neve (nem kötelező)","Contact name (optional)")}">
      <label class="consent"><input id="lead_consent" type="checkbox">
        <span>${LX("Hozzájárulok, hogy a megadott elérhetőségen megkeressenek a pályázati lehetőségekkel kapcsolatban.",
                   "I agree to be contacted at the address above about funding opportunities.")}</span></label>
      ${state.lead.error?`<div class="auth-err">${escapeHtml(state.lead.error)}</div>`:""}
      <button class="btn btn-ghost btn-block" ${state.lead.busy?"disabled":""}
        onclick='submitLead(${readiness}, ${JSON.stringify((ranked||[]).map(x=>x.opp.id))})'>
        ${state.lead.busy?LX("Küldés…","Sending…"):LX("Kérem a megkeresést","Ask for a follow-up")}</button>
    </div>
  </div>`;
}

async function submitLead(readiness, matchIds){
  const email = (document.getElementById("lead_email")||{}).value || "";
  const company = (document.getElementById("lead_company")||{}).value || "";
  const contactName = (document.getElementById("lead_name")||{}).value || "";
  const consent = Boolean((document.getElementById("lead_consent")||{}).checked);

  state.lead.error = null;
  if(!email.trim()){ state.lead.error = LX("Adj meg egy e-mail címet.","Please enter an email address."); render(); return; }
  if(!consent){ state.lead.error = LX("A megkereséshez hozzájárulás szükséges.","We need your consent before we may contact you."); render(); return; }

  state.lead.busy = true; render();
  try {
    await api.post("/api/leads", {
      email, company, contactName, consent, readiness, matchIds,
      answers: state.assess.answers,
      profile: buildProfileFromAssess(),
    });
    state.lead.sent = true;
  } catch(e){ state.lead.error = e.apiMessage || e.message; }
  state.lead.busy = false; render();
}

function startFromAssess(){
  // az assessment válaszait átvisszük az onboardingba
  const p=buildProfileFromAssess();
  state.ob.prefill=p;
  startOnboard();
}
