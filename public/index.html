function obStepValid(step){
  const d=state.ob.data, t=OB_STEPS[step].type;
  if(t==="company") return d.company && d.employees>0 && d.county && d.closed_business_years!==undefined;
  if(t==="activity") return !!d.industryId;
  if(t==="goals") return (d.goals||[]).length>0;
  if(t==="investment") return d.investment_value>0;
  if(t==="setup") return !!d.orgType && d.consortium_ready!==undefined;
  return true;
}
function obSet(k,v){
  state.ob.data[k]=v;
  // A létszám már eldönti a KKV-státuszt, ezért nem kérdezzük meg kétszer.
  if(k==="employees" && v>0 && !state.ob.data.orgTypeTouched) state.ob.data.orgType = v<=249?"sme":"large";
  if(k==="orgType") state.ob.data.orgTypeTouched = true;
  // szabad szöveges/szám mezőknél nincs teljes újrarender (fókusz megtartása) — csak élő frissítés
  if(k==="company"||k==="projectName"||k==="employees"||k==="investment_value"){ obLiveUpdate(); return; }
  render();
}
function obLiveUpdate(){
  const btn=document.getElementById("obNextBtn");
  if(btn) btn.disabled=!obStepValid(state.ob.step);
  const hint=document.getElementById("obInvHint");
  if(hint) hint.innerHTML = state.ob.data.investment_value? "≈ "+fmtHUF(state.ob.data.investment_value) : "&nbsp;";
}
function obSetCounty(c){ const d=state.ob.data; d.county=c; d.region=(REGIONS.find(r=>r.counties.includes(c))||{}).code; render(); }
function obSetIndustry(id){ const d=state.ob.data; d.industryId=id; d.teaor=TEAOR_OF(id); render(); }
function obToggleGoal(g){ const d=state.ob.data; d.goals=d.goals||[]; d.goals.includes(g)?d.goals=d.goals.filter(x=>x!==g):d.goals.push(g); render(); }
function obToggledPref(k){ const d=state.ob.data; d.funding_pref=d.funding_pref||[]; d.funding_pref.includes(k)?d.funding_pref=d.funding_pref.filter(x=>x!==k):d.funding_pref.push(k); render(); }
function obNext(){ state.ob.step++; render(); }
function obBack(){ state.ob.step--; render(); }
function loadDemoCompany(){ state.ob.data={...DEMO_PROFILE}; state.ob.step=1; render(); }
function finishOnboard(){
  const d=state.ob.data;
  d.initials=(d.company||"C").split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  d.country = d.country || "HU";

/* ---------------- DASHBOARD ---------------- */
function viewDashboard(ranked){
  const p=activeProfile();
  const visible=ranked.filter(x=>!x.res.blocked);
  // Zárolt állapotban a kliens csak a keretnek megfelelő felhívásokat kapta meg,
  // ezért az összesítőket a szerver valós számaiból mutatjuk — különben úgy
  // tűnne, mintha összesen három lehetőség lenne.
  const g = catalog.gated ? catalog.stats : null;
  const strong = g ? g.strong : visible.filter(x=>x.res.score>=85).length;

  const newC = visible.filter(x=>x.opp.isNew).length;
  const shown = (state.showAll?visible:visible.filter(x=>x.res.score>=70));
  return `
    <div class="page-head"><h1>${LX(`Üdv, ${p.company}!`,`Welcome, ${p.company}!`)}</h1>

   Nincs fizetési átjáró — a hozzáférést adminisztrátor adja, amíg a magyar
   fizetési szolgáltató be nem köt. A jogosultságot a szerver érvényesíti; a

function isSubscriber(){
  const t = state.auth.entitlements?.tier;
  return t === "subscriber" || t === "admin";
}
function isAdmin(){ return state.auth.user?.role === "admin"; }

function applyAuth(payload){
  state.auth.user = payload.user || null;
  state.auth.entitlements = payload.entitlements || {tier:"anonymous", maxResults:3, explanations:false};
  if(payload.plans) state.auth.plans = payload.plans;
  if(payload.adminSeed) state.auth.adminSeed = payload.adminSeed;
  state.auth.checked = true;
  // A bejelentkezett cég profilja a szerveren él, hogy eszközök között kövesse.
  if(payload.user && payload.user.hasProfile === false && state.profile){
    api.post("/api/profile", {profile: state.profile}).catch(()=>{});
  }
}

async function loadAuth(){
  try { applyAuth(await api.get("/api/auth/me")); }
  catch(e){ state.auth.checked = true; }
}

function goAuth(mode){
  state.screen = "auth";
  state.auth.mode = mode || "login";
  state.auth.error = null;
  render();
}

async function submitAuth(){
  const form = {
    username: (document.getElementById("au_user")||{}).value,
    password: (document.getElementById("au_pass")||{}).value,
    company:  (document.getElementById("au_company")||{}).value,
    email:    (document.getElementById("au_email")||{}).value,
  };
  state.auth.busy = true; state.auth.error = null; render();
  try {
    const path = state.auth.mode === "register" ? "/api/auth/register" : "/api/auth/login";
    const res = await api.post(path, form);
    applyAuth({user:res.user, entitlements:res.user.entitlements});
    await loadAuth();
    await loadCatalog();

    // Ha a fiókhoz tartozik mentett cégprofil, azt vesszük át.
    try {
      const p = await api.get("/api/profile");
      if(p.profile){ state.profile = p.profile; state.answers = p.answers || {}; state.saved = p.saved || []; saveState(); }
    } catch(e){}

    state.auth.busy = false;
    if(res.user.role === "admin"){
      // Az adminisztrátornak nincs szüksége cégprofilra a konzol használatához.
      state.workspace = "admin";
      state.screen = "app";
      state.appTab = "adminOverview";
    } else if(state.profile){
      state.screen="app"; state.appTab="dashboard"; state.justLoaded=true;
    } else {
      state.screen="onboard"; state.ob.step=0; state.ob.data={goals:[],funding_pref:["non_refundable"]};
    }
    render();
    toast(LX(`Üdv, ${res.user.username}!`, `Welcome, ${res.user.username}!`));
  } catch(err){
    state.auth.busy = false;
    state.auth.error = await readApiError(err);
    render();
  }
}

/* A szerver magyar nyelvű hibaüzenetet ad; azt mutatjuk, nem a HTTP kódot. */
async function readApiError(err){
  return (err && err.apiMessage) || (err && err.message) || L("Ismeretlen hiba");
}

async function logout(){
  try { await api.post("/api/auth/logout"); } catch(e){}

  state.screen = "landing";

const ACTIVITY_LABEL = {
  "account.created":     ["Fiók létrehozva","Account created"],
  "account.login":       ["Belépés","Signed in"],
  "account.password_changed":["Jelszó módosítva","Password changed"],
  "account.updated":     ["Fiók módosítva","Account updated"],
  "profile.saved":       ["Cégprofil mentve","Company profile saved"],
  "profile.restored":    ["Korábbi profil visszaállítva","Earlier profile restored"],
  "profile.answered":    ["Jogosultsági kérdés megválaszolva","Eligibility question answered"],
  "opportunity.viewed":  ["Felhívás megnyitva","Call opened"],
  "opportunity.saved":   ["Felhívás elmentve","Call saved"],
  "opportunity.unsaved": ["Mentés visszavonva","Call unsaved"],
  "subscription.granted":["Előfizetés megadva","Subscription granted"],
  "subscription.revoked":["Előfizetés visszavonva","Subscription revoked"],
  "search":              ["Keresés","Search"],
  "crm.stage":           ["CRM szakasz módosítva","CRM stage changed"],
  "crm.lead_converted":  ["Érdeklődőből fiók lett","Lead became an account"],
};
function activityLabel(type){
  const e = ACTIVITY_LABEL[type];
  return e ? LX(e[0],e[1]) : type;
}

function fieldLabel(f){
  const g = GOALS.find(x=>x.id===f);
  if(g) return GOAL_LABEL(f);
  const map = {
    company:["Cégnév","Company"], employees:["Létszám","Employees"], county:["Megye","County"],
    region:["Régió","Region"], teaor:["TEÁOR","NACE"], industryId:["Iparág","Industry"],
    sector:["Szektor","Sector"], orgType:["Szervezeti forma","Organisation type"],
    revBand:["Árbevétel","Revenue"], closed_business_years:["Lezárt üzleti évek","Closed business years"],
    goals:["Fejlesztési célok","Development goals"], investment_value:["Projektérték","Project value"],
    projectName:["Projekt neve","Project name"], funding_pref:["Forráspreferencia","Funding preference"],
    consortium_ready:["Konzorciumi készség","Consortium capability"],
    eu_experience:["EU-s tapasztalat","EU experience"], de_minimis_ok:["De minimis keret","De minimis headroom"],
  };
  return map[f] ? LX(map[f][0],map[f][1]) : f;
}
function fmtFieldValue(f,v){
  if(v===null||v===undefined||v==="") return "—";
  if(Array.isArray(v)) return v.map(x=>fieldLabel(x)).join(", ") || "—";
  if(typeof v==="boolean") return v?L("Igen"):L("Nem");
  if(f==="investment_value") return fmtHUF(v);
  return String(v);
}

async function grantSubscription(userId){
  const plan = (document.getElementById("plan_"+userId)||{}).value;
  const days = (document.getElementById("days_"+userId)||{}).value;
  const note = (document.getElementById("note_"+userId)||{}).value;
  try {
    await api.post("/api/admin/subscription", {userId, planId:plan, days:days?Number(days):undefined, note});
    await loadAdmin();
    toast(L("Előfizetés megadva"));
  } catch(e){ toast(L("Nem sikerült megadni az előfizetést")); }
}
async function revokeSubscription(userId){
  try { await api.post("/api/admin/subscription", {userId, revoke:true}); await loadAdmin(); toast(L("Előfizetés visszavonva")); }

/* Zárolt találat.
 *
 * A pontszám és a támogatási összeg valós — a szerver a te cégprofilodra
 * számolta. A felhívás neve, programja, határideje és linkje nincs a lapon:
 * a kitakart sáv nem elhomályosított szöveg, hanem hiányzó adat. Aki a
 * fejlesztői eszközökben nézi meg a választ, ugyanennyit lát. */
function teaserRow(t){
  const money = t.grantHuf
    ? `${L("Neked járó támogatás")}: <b class="teaser-money">${fmtHUF(t.grantHuf)}</b>`
    : t.fundingMax
      ? `${L("Támogatási keret")}: <b class="teaser-money">${fmtHUF(t.fundingMax)}</b>`
      : `<span style="color:var(--muted)">${L("Támogatás: a felhívás nem közli")}</span>`;
  return `<div class="opp opp-teaser">
    <div class="opp-score">
      <div class="n">${t.score!=null?t.score:"—"}${t.estimated?'<sup style="font-size:11px">*</sup>':""}</div>
      <div class="b">${t.band?escapeHtml(t.band.label):""}</div>
    </div>
    <div class="opp-body">
      <div class="prog"><span class="redact r-prog">redacted</span></div>
      <h3><span class="redact r-title">redacted</span></h3>
      <div class="opp-meta">
        <span>${money}</span>
        ${t.intensity!=null?`<span>${Math.round(t.intensity*100)}% ${L("támogatási intenzitás")}</span>`:""}
        ${t.closingSoon?`<span style="color:var(--amber)"><b>${L("Hamarosan lejár")}</b></span>`:""}
      </div>
    </div>
    <div class="opp-right"><span class="teaser-lock">${IC.lock} ${L("Feloldás")}</span></div>
  </div>`;
}

/* A keresés és a mentett lista ugyanazt a sort kapja vissza a szervertől. */

/* =========================================================================
   CRM — ÜGYFÉLKAPCSOLAT
   Az admin konzol első három képernyője arra válaszol, kinek kell ma hozzáférés.
   Ez arra, ami utána jön: kit érdemes felhívni, mennyit ér egy fiók havonta,
   melyik próbaidő jár le megújítás nélkül, és mi hangzott el legutóbb.

   Fontos elv, ugyanaz, mint a pályázati oldalon: a felület egyetlen számot sem
   talál ki. A szakasz az egyetlen mező, amit ember állít be — az életciklus, az
   aktivitás és a bevétel a rögzített tényekből számolódik a szerveren, és a
   felület csak megmutatja, honnan jön.
   ========================================================================= */
const CRM_TABS = ["board","contacts","leads","insights"];

const NOTE_KIND_LABEL = {
  note:     ["Feljegyzés","Note"],
  call:     ["Telefon","Call"],
  email:    ["E-mail","Email"],
  meeting:  ["Találkozó","Meeting"],
  decision: ["Döntés","Decision"],
};
function noteKindLabel(k){ const e=NOTE_KIND_LABEL[k]; return e?LX(e[0],e[1]):k; }

function vocabLabel(list, id){
  const e = (list||[]).find(x=>x.id===id);
  if(!e) return id||"—";
  return state.lang==="en" ? (e.label_en||e.label_hu) : (e.label_hu||e.label_en);
}
function stageLabel(id){ return vocabLabel(state.crm.vocabulary?.stages, id); }
function lifecycleLabel(id){ return vocabLabel(state.crm.vocabulary?.lifecycles, id); }
function sourceLabel(id){ return vocabLabel(state.crm.vocabulary?.sources, id); }

/* A HUF összegeket a listákban rövidítve mutatjuk, de a kulcsszámokat (MRR,
   ARR) kiírjuk, mert azokat le is szokták írni. */
function fmtMoney(v){
  if(v===null||v===undefined) return "—";
  return state.lang==="en"
    ? new Intl.NumberFormat("en-GB").format(Math.round(v))+" HUF"
    : new Intl.NumberFormat("hu-HU").format(Math.round(v))+" Ft";
}
function fmtDay(iso){
  if(!iso) return "—";
  const d=new Date(iso);
  if(isNaN(d)) return "—";
  return d.toLocaleDateString(state.lang==="en"?"en-GB":"hu-HU",{year:"numeric",month:"short",day:"2-digit"});
}

/* ---------------- adatbetöltés ---------------- */
async function loadCrm(force){
  if(state.crm.loading) return;
  if(state.crm.board && !force) return;
  state.crm.loading = true; state.crm.error = null; render();
  try { state.crm.board = await api.get("/api/admin/crm"); state.crm.vocabulary = state.crm.board.vocabulary; }
  catch(e){ state.crm.error = e.apiMessage || e.message; }
  state.crm.loading = false; render();
}

function crmQueryString(){
  const f = state.crm.filters, p = new URLSearchParams();
  if(f.q) p.set("q", f.q);
  if(f.stage) p.set("stage", f.stage);
  if(f.lifecycle) p.set("lifecycle", f.lifecycle);
  if(f.source) p.set("source", f.source);
  if(f.owner) p.set("owner", f.owner);
  if(f.kind) p.set("kind", f.kind);
  if(f.overdue) p.set("overdue","true");
  if(f.sort) p.set("sort", f.sort);
  p.set("page", String(state.crm.page||1));
  p.set("pageSize","25");
  return p.toString();
}

async function loadCrmContacts(){
  state.crm.listLoading = true; render();
  try {
    state.crm.list = await api.get("/api/admin/crm/contacts?"+crmQueryString());
    state.crm.vocabulary = state.crm.list.vocabulary || state.crm.vocabulary;
  } catch(e){ state.crm.error = e.apiMessage || e.message; }

/* A teljes profilverzió-történet a felhasználók képernyőn él, ezért oda viszünk
   át — a CRM lapja az idővonalat mutatja, nem a verziók diffjeit. */
function crmOpenHistory(id){
  state.crm.openId=null; state.crm.contact=null;
  state.appTab="admin";
  openUserHistory(id);
}

function setCrmTab(t){ state.crm.tab=t; state.crm.openId=null; state.crm.contact=null; render();
  if(t==="contacts" && !state.crm.list) loadCrmContacts();
  if(t==="leads" && !state.crm.leads) loadCrmLeads();
}

/* ---------------- műveletek ---------------- */
/* Minden művelet után a nyitott nézetet töltjük újra, nem a helyi másolatot
   írjuk át: a szakaszváltás az életciklust és a bevételi számokat is érinti,
   és azokat a szerver számolja. */
async function refreshCrmViews(){
  const jobs = [];
  if(state.crm.board) jobs.push(loadCrm(true));
  if(state.crm.tab==="contacts") jobs.push(loadCrmContacts());
  if(state.crm.tab==="leads") jobs.push(loadCrmLeads());
  if(state.crm.openId) jobs.push(openContact(state.crm.openId));
  await Promise.all(jobs);
}

async function setContactStage(id, stage){
  let lostReason = null;
  if(stage==="lost"){
    lostReason = prompt(LX("Miért veszett el? (nem kötelező)","Why was it lost? (optional)")) || null;
  }
  try {
    await api.post("/api/admin/crm/contact", {id, stage, lostReason});
    await refreshCrmViews();
    toast(LX(`Áthelyezve: ${stageLabel(stage)}`, `Moved to ${stageLabel(stage)}`));
  } catch(e){ toast(e.apiMessage || e.message); }
}

async function setContactField(id, patch){
  try { await api.post("/api/admin/crm/contact", Object.assign({id}, patch)); await refreshCrmViews(); }
  catch(e){ toast(e.apiMessage || e.message); }
}

function saveContactOwner(id){
  const el = document.getElementById("crm_owner");
  setContactField(id, {owner: el ? el.value.trim() : ""});
}
function saveContactTags(id){
  const el = document.getElementById("crm_tags");
  const tags = el ? el.value.split(",").map(t=>t.trim()).filter(Boolean) : [];
  setContactField(id, {tags});
}

async function addCrmNote(id){
  const body = document.getElementById("crm_note");
  const kind = document.getElementById("crm_note_kind");
  const text = body ? body.value.trim() : "";
  if(!text){ toast(LX("A bejegyzés nem lehet üres.","The note cannot be empty.")); return; }
  try {
    await api.post("/api/admin/crm/note", {id, text, kind: kind?kind.value:"note"});
    if(body) body.value = "";
    await openContact(id);
    if(state.crm.board) await loadCrm(true);
  } catch(e){ toast(e.apiMessage || e.message); }
}
async function deleteCrmNote(id, noteId){
  try { await api.post("/api/admin/crm/note", {id, noteId, remove:true}); await openContact(id); }
  catch(e){ toast(e.apiMessage || e.message); }
}

async function addCrmTask(id){
  const t = document.getElementById("crm_task");
  const d = document.getElementById("crm_task_due");
  const title = t ? t.value.trim() : "";
  if(!title){ toast(LX("A teendőhöz megnevezés kell.","A task needs a title.")); return; }
  try {
    await api.post("/api/admin/crm/task", {id, title, dueAt: d && d.value ? d.value : null});
    if(t) t.value = ""; if(d) d.value = "";
    await openContact(id);
    if(state.crm.board) await loadCrm(true);
  } catch(e){ toast(e.apiMessage || e.message); }
}
async function toggleCrmTask(id, taskId, done){
  try { await api.post("/api/admin/crm/task", {id, taskId, done}); await openContact(id); if(state.crm.board) await loadCrm(true); }
  catch(e){ toast(e.apiMessage || e.message); }
}
async function deleteCrmTask(id, taskId){
  try { await api.post("/api/admin/crm/task", {id, taskId, remove:true}); await openContact(id); if(state.crm.board) await loadCrm(true); }
  catch(e){ toast(e.apiMessage || e.message); }
}

/* Hozzáférés megadása közvetlenül a kapcsolatlapról — a legtöbb szakaszváltás
   úgyis ezzel végződik, és így nem kell átmenni a felhasználók képernyőre. */
async function grantFromCrm(id){
  const plan = document.getElementById("crm_plan");
  const days = document.getElementById("crm_days");
  const note = document.getElementById("crm_grant_note");
  try {
    await api.post("/api/admin/subscription", {
      userId: id,
      planId: plan ? plan.value : "monthly",
      days: days && days.value ? Number(days.value) : undefined,
      note: note ? note.value : undefined,
    });

    await refreshCrmViews();
    toast(L("Előfizetés megadva"));
  } catch(e){ toast(e.apiMessage || e.message); }
}
async function revokeFromCrm(id){
  try { await api.post("/api/admin/subscription", {userId:id, revoke:true}); await refreshCrmViews(); toast(L("Előfizetés visszavonva")); }
  catch(e){ toast(e.apiMessage || e.message); }
}
async function deleteCrmLead(id){
  if(!confirm(LX("Biztosan törlöd ezt az érdeklődőt?","Delete this lead for good?"))) return;
  try { await api.post("/api/admin/crm/lead", {id, remove:true}); closeContact(); await refreshCrmViews(); }
  catch(e){ toast(e.apiMessage || e.message); }
}

function setCrmFilter(key, value){
  state.crm.filters[key] = value || undefined;

}

function exportCrmCsv(){

  window.location.href = "/api/admin/crm/contacts?"+p.toString();
}

/* Húzd-és-ejtsd a táblán. Érintőképernyőn nem működik megbízhatóan, ezért
   minden kártyán ott a szakaszválasztó is — az a működő út mobilon. */
function crmDragStart(ev, id){
  state.crm.dragging = id;
  if(ev && ev.dataTransfer){ ev.dataTransfer.effectAllowed="move"; try{ ev.dataTransfer.setData("text/plain", id); }catch(e){} }
  if(ev && ev.currentTarget && ev.currentTarget.classList) ev.currentTarget.classList.add("dragging");
}
function crmDragEnd(ev){
  state.crm.dragging = null;
  if(ev && ev.currentTarget && ev.currentTarget.classList) ev.currentTarget.classList.remove("dragging");
}
function crmDragOver(ev, stage){
  if(ev){ ev.preventDefault(); if(ev.dataTransfer) ev.dataTransfer.dropEffect="move"; }
  const col = document.getElementById("col_"+stage);
  if(col && col.classList) col.classList.add("drop");
}
function crmDragLeave(stage){
  const col = document.getElementById("col_"+stage);
  if(col && col.classList) col.classList.remove("drop");
}
function crmDrop(ev, stage){
  if(ev) ev.preventDefault();
  crmDragLeave(stage);
  let id = state.crm.dragging;
  if(!id && ev && ev.dataTransfer){ try{ id = ev.dataTransfer.getData("text/plain"); }catch(e){} }
  state.crm.dragging = null;
  if(id) setContactStage(id, stage);
}

function lifeBadge(lc){

}
function engBar(eng){
  const band = eng.band ? eng.band.key : "none";
  const label = eng.band ? (state.lang==="en"?eng.band.label_en:eng.band.label_hu) : "";
  return `<span class="eng ${band}" title="${escapeHtml(LX(
      `Aktivitási mutató az elmúlt ${eng.window||30} nap rögzített eseményeiből`,
      `Activity indicator from the recorded events of the last ${eng.window||30} days`))}">
    <span class="bar"><i style="width:${Math.max(0,Math.min(100,eng.score))}%"></i></span>${eng.score} · ${escapeHtml(label)}</span>`;
}

function contactCard(c){
  const next = c.nextTask;
  const overdue = c.overdueTasks>0;
  const stages = state.crm.vocabulary?.stages || [];
  return `<div class="ccard" draggable="true"
      ondragstart="crmDragStart(event,'${c.id}')" ondragend="crmDragEnd(event)">
    <span class="co" onclick="openContact('${c.id}')">${escapeHtml(c.company || c.username || c.email || "—")}</span>
    <span class="who" onclick="openContact('${c.id}')">${escapeHtml(c.username || c.contactName || c.email || "—")}</span>
    <div class="meta">
      ${lifeBadge(c.lifecycle)}
      ${c.kind==="account" ? engBar(c.engagement) : (c.readiness!=null?`<span class="eng"><span class="bar"><i style="width:${c.readiness}%"></i></span>${c.readiness} · ${LX("felmérés","assessment")}</span>`:"")}
    </div>
    <div class="meta">
      ${(c.tags||[]).slice(0,3).map(t=>`<span class="ctag">${escapeHtml(t)}</span>`).join("")}
      ${c.daysInStage!=null?`<span class="cstale">${LX(`${c.daysInStage} napja itt`,`${c.daysInStage}d in stage`)}</span>`:""}
    </div>
    ${next?`<div class="next ${overdue?"due":""}"><span class="ic">${IC.cal}</span>
      <span>${escapeHtml(next.title)}${next.dueAt?` · ${fmtDay(next.dueAt)}`:""}</span></div>`:""}
    <select class="stage-pick" onchange="setContactStage('${c.id}',this.value)"
      aria-label="${LX("Szakasz","Stage")}">
      ${stages.map(s=>`<option value="${s.id}" ${s.id===c.stage?"selected":""}>${escapeHtml(state.lang==="en"?s.label_en:s.label_hu)}</option>`).join("")}

  </div>`;
}

/* ---------------- CRM keret ---------------- */
function viewCrm(){
  if(!isAdmin()) return `<div class="search-empty"><b>${L("Nincs jogosultságod ehhez a nézethez")}</b></div>`;
  if(state.crm.openId) return viewCrmContact();

  if(!state.crm.board && !state.crm.loading && !state.crm.error) loadCrm();
  if(state.crm.error) return `<div class="page-head"><h1>CRM</h1></div><div class="auth-err">${escapeHtml(state.crm.error)}</div>`;
  if(!state.crm.board) return `<div class="page-head"><h1>CRM</h1></div><div class="search-empty">${L("Betöltés…")}</div>`;

  const m = state.crm.board.metrics;
  const tab = state.crm.tab || "board";
  const t = (id,hu,en,count)=>`<button class="${tab===id?"on":""}" onclick="setCrmTab('${id}')">${LX(hu,en)}${count!=null?`<span class="c">${count}</span>`:""}</button>`;

  return `
    <div class="page-head"><h1>CRM</h1>

      ${t("board","Tábla","Pipeline", m.openDeals)}
      ${t("contacts","Kapcsolatok","Contacts", m.contacts)}
      ${t("leads","Érdeklődők","Leads", m.leads)}
      ${t("insights","Mutatók","Insights")}

/* ---------------- tábla ---------------- */
function crmBoard(){
  const d = state.crm.board, m = d.metrics;
  const stages = d.vocabulary.stages;
  const tasks = d.tasks || [];
  const today = new Date().toISOString().slice(0,10);
  const overdue = tasks.filter(t=>t.dueAt && t.dueAt.slice(0,10) < today);
  const dueToday = tasks.filter(t=>t.dueAt && t.dueAt.slice(0,10) === today);

  return `
    <div class="crm-kpis">
      <div class="kpi green"><div class="n">${fmtMoney(m.mrrHuf)}</div><div class="l">MRR</div>
        <div class="s">${LX(`${m.subscribers} előfizető · ARR ${fmtMoney(m.arrHuf)}`,`${m.subscribers} subscribers · ARR ${fmtMoney(m.arrHuf)}`)}</div></div>
      <div class="kpi amber"><div class="n">${m.trials}</div><div class="l">${LX("Futó próba","Running trials")}</div>
        <div class="s">${m.trialConversionPct!=null
          ? LX(`Eddigi átváltás: ${m.trialConversionPct}% (${m.trialConverted}/${m.trialStarted})`,`Converted so far: ${m.trialConversionPct}% (${m.trialConverted}/${m.trialStarted})`)
          : LX("Még nincs lezárt próba","No completed trial yet")}</div></div>
      <div class="kpi"><div class="n">${m.openDeals}</div><div class="l">${LX("Nyitott ügy","Open deals")}</div>
        <div class="s">${LX(`Várható érték: ${fmtMoney(m.pipelineValueHuf)} / hó`,`Expected value: ${fmtMoney(m.pipelineValueHuf)} / mo`)}</div></div>
      <div class="kpi gold"><div class="n">${overdue.length}</div><div class="l">${LX("Lejárt teendő","Overdue tasks")}</div>
        <div class="s">${LX(`Ma esedékes: ${dueToday.length}`,`Due today: ${dueToday.length}`)}</div></div>
      <div class="kpi"><div class="n">${m.expired}</div><div class="l">${LX("Lejárt előfizetés","Lapsed")}</div>
        <div class="s">${m.churnPct!=null
          ? LX(`30 napon belül: ${m.lapsed30d} · lemorzsolódás ${m.churnPct}%`,`In the last 30 days: ${m.lapsed30d} · churn ${m.churnPct}%`)
          : LX("Még nincs miből lemorzsolódni","Nothing to churn from yet")}</div></div>
    </div>

    ${overdue.length?`<div class="panel" style="border-color:var(--red)">
      <h2>${LX("Lejárt teendők","Overdue follow-ups")}</h2>
      <div class="tasks">${overdue.slice(0,6).map(t=>`
        <div class="task due"><div class="tk">
          <div class="tt">${escapeHtml(t.title)}</div>
          <div class="td late">${fmtDay(t.dueAt)} · ${escapeHtml(t.company||t.username||"—")}</div></div>
          <button class="btn-xs" onclick="openContact('${t.subjectId}')">${LX("Megnyitás","Open")}</button>
        </div>`).join("")}</div>
    </div>`:""}

    <div class="board">
      ${stages.map(s=>{
        const col = d.board[s.id] || [];
        return `<div class="board-col" id="col_${s.id}"
          ondragover="crmDragOver(event,'${s.id}')" ondragleave="crmDragLeave('${s.id}')" ondrop="crmDrop(event,'${s.id}')">
          <div class="board-head"><b>${escapeHtml(state.lang==="en"?s.label_en:s.label_hu)}</b><span class="n">${col.length}</span></div>
          ${col.length ? col.map(contactCard).join("") : `<div class="board-empty">${LX("Üres","Empty")}</div>`}
        </div>`;
      }).join("")}
    </div>

    <p class="psub" style="margin-top:12px">${LX(
      "A kártyák húzhatók a szakaszok között; érintőképernyőn a kártyán lévő legördülő a megbízható út. A szakasz az egyetlen mező, amit ember állít be — az életciklus (érdeklődő, próba, előfizető, lejárt) a valós előfizetésből olvasódik ki.",
      "Cards drag between stages; on a touch screen the dropdown on the card is the reliable route. Stage is the only field a person sets — the lifecycle (lead, trial, subscriber, lapsed) is read off the real subscription.")}</p>
  `;
}

/* ---------------- mutatók ----------------
   A diagramok beágyazott SVG-k a szerver által küldött számokból. Nincs
   diagramkönyvtár, és nincs kitalált adatpont: ahol nincs mért érték, ott üres
   állapot van, nem nulla oszlop. */
function crmInsights(){
  const d = state.crm.board, m = d.metrics;
  const trend = d.trend || [];
  const maxT = Math.max(1, ...trend.map(b=>Math.max(b.signups+b.leads, 1)));
  const stages = d.vocabulary.stages;
  const maxStage = Math.max(1, ...stages.map(s=>m.byStage[s.id]||0));
  const monthName = b => new Date(b.year, b.month-1, 1)
    .toLocaleDateString(state.lang==="en"?"en-GB":"hu-HU",{month:"short"});

  const funnel = [
    [LX("Érdeklődő","Leads"), m.leads],
    [LX("Regisztrált","Registered"), m.registered],
    [LX("Próbaidőn","On trial"), m.trials],
    [LX("Előfizető","Subscribers"), m.subscribers],
  ];
  const maxF = Math.max(1, ...funnel.map(f=>f[1]));

  return `
    <div class="crm-kpis">
      <div class="kpi green"><div class="n">${fmtMoney(m.mrrHuf)}</div><div class="l">MRR</div>
        <div class="s">${LX("Az aktív, fizetős előfizetések 30 napra vetített értéke","The 30-day value of subscriptions that are active right now")}</div></div>
      <div class="kpi"><div class="n">${fmtMoney(m.arrHuf)}</div><div class="l">ARR</div>
        <div class="s">${LX("MRR × 12 — nem előrejelzés","MRR × 12 — not a forecast")}</div></div>
      <div class="kpi"><div class="n">${m.subscribers?fmtMoney(m.arpaHuf):"—"}</div><div class="l">${LX("Átlagos havi díj","Average per account")}</div>
        <div class="s">${LX(`${m.subscribers} fizető fiók`,`${m.subscribers} paying accounts`)}</div></div>
      <div class="kpi amber"><div class="n">${m.trialConversionPct!=null?m.trialConversionPct+"%":"—"}</div><div class="l">${LX("Próba → előfizetés","Trial → paid")}</div>
        <div class="s">${m.trialConversionPct!=null
          ? LX(`${m.trialConverted} a ${m.trialStarted} próbából`,`${m.trialConverted} of ${m.trialStarted} trials`)
          : LX("Még egy próba sem zárult le","No trial has completed yet")}</div></div>
    </div>

    <div class="adm-grid">
      <div class="adm-card">
        <h3>${LX("Tölcsér","Funnel")}</h3>
        <div class="funnel">${funnel.map(([label,n])=>`
          <div class="funnel-row"><span>${escapeHtml(label)}</span>
            <span class="fb"><i style="width:${Math.round(n/maxF*100)}%"></i></span>
            <span class="fn">${n}</span></div>`).join("")}</div>
      </div>

      <div class="adm-card">
        <h3>${LX("Szakaszok","Stages")}</h3>
        <div class="funnel">${stages.map(s=>{
          const n = m.byStage[s.id]||0;
          return `<div class="funnel-row"><span>${escapeHtml(state.lang==="en"?s.label_en:s.label_hu)}</span>
            <span class="fb"><i style="width:${Math.round(n/maxStage*100)}%"></i></span>
            <span class="fn">${n}</span></div>`;
        }).join("")}</div>
      </div>

      <div class="adm-card">
        <h3>${LX("Bevétel csomag szerint","Revenue by plan")}</h3>
        ${Object.keys(m.byPlan).length
          ? Object.entries(m.byPlan).map(([plan,x])=>`
              <div class="sys-row"><span>${escapeHtml(vocabLabel(d.vocabulary.plans, plan))} · ${x.count}</span><b>${fmtMoney(x.monthlyHuf)}</b></div>`).join("")
          : `<div class="adm-empty">${LX("Még nincs aktív fizetős előfizetés.","No paid subscription is active yet.")}</div>`}
      </div>

      <div class="adm-card">
        <h3>${LX("Honnan érkeztek","Where they came from")}</h3>
        ${Object.keys(m.bySource).length
          ? Object.entries(m.bySource).map(([src,n])=>`
              <div class="sys-row"><span>${escapeHtml(sourceLabel(src))}</span><b>${n}</b></div>`).join("")

    <div class="panel">

                           "From the real timestamps of sign-ups and leads, over the last six months. An empty month is shown too, because that is information as well.")}</p>
      <svg class="chart" viewBox="0 0 360 120" role="img"

        ${trend.map((b,i)=>{

        `Accounts that used the product in the last ${d.engagementWindowDays} days but have no subscription. This is the most useful call order there is, because it rests on things that actually happened.`)}</p>

/* Az idővonal sorai. A CRM saját eseményeit itt nevezzük meg; a fiók
   tevékenységeihez a már meglévő szótárat használjuk, hogy egy esemény
   mindenhol ugyanúgy hívódjon. */
const CRM_TIMELINE_LABEL = {
  "profile.version":       ["Cégprofil módosult","Company profile changed"],
  "task.created":          ["Teendő rögzítve","Follow-up added"],
  "task.completed":        ["Teendő kész","Follow-up completed"],
  "crm.stage":             ["Szakasz módosítva","Stage changed"],
  "crm.lead_converted":    ["Érdeklődőből fiók lett","Lead became an account"],
};
function timelineLabel(e){
  if(e.kind === "note") return noteKindLabel(e.detail.kind) + LX(" rögzítve"," logged");
  const own = CRM_TIMELINE_LABEL[e.type];
  if(own) return LX(own[0], own[1]);
  return activityLabel(e.type);
}
function timelineDetail(e){
  const d = e.detail || {};
  if(e.kind === "note") return String(d.body||"").slice(0,180);
  if(e.kind === "task") return d.dueAt ? LX(`Határidő: ${fmtDay(d.dueAt)}`,`Due ${fmtDay(d.dueAt)}`) : "";
  if(e.kind === "subscription"){
    return [d.plan, d.days?LX(`${d.days} nap`,`${d.days} days`):"", d.by?LX(`kiosztotta: ${d.by}`,`by ${d.by}`):"", d.note||""]
      .filter(Boolean).join(" · ");
  }
  if(e.type === "profile.version"){
    const ch = d.changed || [];
    if(!ch.length) return LX("első mentés","first save");
    return ch.slice(0,3).map(c=>`${fieldLabel(c.field)}: ${fmtFieldValue(c.field,c.from)} → ${fmtFieldValue(c.field,c.to)}`).join(" · ");
  }
  return d.title || d.q || d.field || d.stage || "";
}

/* ---------------- KERESÉS ----------------
   A szabad szavas keresés a szerver BM25 indexén fut (/api/search), mert a
   relevancia-sorrendhez a teljes korpusz statisztikája kell. A találatokat a
   szerver a cégprofilra pontozva adja vissza, a facet-számokat pedig mindig a
   szűrt halmazon számolja, így a szűrők nem vezetnek zsákutcába. */
const SORTS = [
  {k:"", hu:"Relevancia", en:"Relevance"},
  {k:"-score", hu:"Hunter Score", en:"Hunter Score"},
  {k:"deadline", hu:"Határidő", en:"Deadline"},
  {k:"-budget", hu:"Támogatás", en:"Grant size"},
];
const FACET_DEFS = [
  {key:"program",  hu:"Program",        en:"Programme",       label:v=>programLabel(v)},
  {key:"goals",    hu:"Fejlesztési cél", en:"Development goal", label:v=>GOAL_LABEL(v)},
  {key:"actionCode", hu:"Támogatási forma", en:"Funding instrument", label:v=>actionLabel(v)},
  {key:"consortium", hu:"Pályázói forma", en:"Applicant setup",
     label:v=>v==="required"?LX("Konzorcium szükséges","Consortium required"):LX("Önállóan is pályázható","Can apply alone")},
];

function programLabel(code){
  const m = catalog.meta && catalog.meta.labels && catalog.meta.labels.programmes;
  return (m && m[code]) || code;
}
function actionLabel(code){
  const m = catalog.meta && catalog.meta.labels && catalog.meta.labels.actions;
  return (m && m[code]) || code || "—";
}

function searchQueryString(){
  const f = state.search.filters;
  const qs = new URLSearchParams();
  if(state.search.q) qs.set("q", state.search.q);
  Object.entries(f).forEach(([k,vals])=>{
    if(Array.isArray(vals)){ if(vals.length) qs.set(k, vals.join(",")); }
    else if(vals!==undefined && vals!=="" && vals!==null) qs.set(k, vals);
  });
  if(state.search.sort) qs.set("sort", state.search.sort);
  qs.set("page", state.search.page);
  qs.set("pageSize", state.search.pageSize);
  qs.set("lang", state.lang);
  return qs.toString();
}

async function runSearch(){
  const s = state.search;
  s.loading = true; s.error = null;
  const token = ++s.ranAt;
  render();
  try {
    const res = await api.scored("/api/search?" + searchQueryString());
    if(token !== s.ranAt) return;   // közben újabb keresés indult
    s.result = res;
  } catch(err){
    if(token !== s.ranAt) return;
    s.error = err.message;
    s.result = null;
  } finally {
    if(token === s.ranAt){ s.loading = false; render(); }
  }
}

function onSearchInput(el){ state.search.q = el.value; }
function submitSearch(){ state.search.page = 1; runSearch(); }
function setSort(k){ state.search.sort = k; state.search.page = 1; runSearch(); }
function gotoPage(n){ state.search.page = n; runSearch(); }

function toggleFacet(key, value){
  const f = state.search.filters;
  if(key === "consortium"){
    f.consortium = f.consortium === value ? undefined : value;
    if(!f.consortium) delete f.consortium;
  } else {
    const list = f[key] || [];
    f[key] = list.includes(value) ? list.filter(v=>v!==value) : list.concat([value]);
    if(!f[key].length) delete f[key];
  }
  state.search.page = 1;
  runSearch();
}
function toggleEligibleOnly(){
  const f = state.search.filters;
  if(f.eligibleOnly) delete f.eligibleOnly; else f.eligibleOnly = "true";
  state.search.page = 1;
  runSearch();
}
function clearFilters(){ state.search.filters = {}; state.search.page = 1; runSearch(); }

function activeFilterChips(){
  const f = state.search.filters, chips = [];
  FACET_DEFS.forEach(d=>{
    const v = f[d.key];
    if(Array.isArray(v)) v.forEach(val=>chips.push({key:d.key, value:val, text:d.label(val)}));
    else if(v) chips.push({key:d.key, value:v, text:d.label(v)});
  });
  if(f.eligibleOnly) chips.push({key:"eligibleOnly", value:"true", text:LX("Csak amire jogosult vagyok","Only what I am eligible for")});
  return chips;
}
function removeChip(key, value){
  if(key === "eligibleOnly"){ toggleEligibleOnly(); return; }
  toggleFacet(key, value);
}

function viewSearch(){
  const s = state.search, r = s.result;
  const chips = activeFilterChips();

  const placeholder = LX("Keress témára, programra vagy azonosítóra — pl. hidrogén, digitalizáció, HORIZON-CL4",
                         "Search a topic, programme or identifier — e.g. hydrogen, digitalisation, HORIZON-CL4");
  const bar = `
    <div class="search-bar">
      <span class="sic">${IC.search}</span>
      <input id="searchq" type="search" value="${escapeHtml(s.q)}" autocomplete="off"
        placeholder="${escapeHtml(placeholder)}"
        oninput="onSearchInput(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();submitSearch();}">
      <button class="go" onclick="submitSearch()">${L("Keresés")}</button>
    </div>`;

  const countText = r
    ? LX("<b>" + r.total + "</b> találat" + (s.q ? " erre: " + escapeHtml(s.q) : ""),
         "<b>" + r.total + "</b> result" + (r.total===1?"":"s") + (s.q ? " for " + escapeHtml(s.q) : ""))
    : (s.loading ? L("Keresés…") : L("Írj be egy kifejezést, vagy szűrj a lenti szempontok szerint."));

  const sortBar = `
    <div class="search-meta">
      <div class="cnt">${countText}</div>
      <div class="search-sort">
        <button class="${s.filters.eligibleOnly?"on":""}" onclick="toggleEligibleOnly()">${LX("Csak amire jogosult vagyok","Only eligible")}</button>
        ${SORTS.map(o=>`<button class="${s.sort===o.k?"on":""}" onclick="setSort('${o.k}')">${state.lang==="en"?o.en:o.hu}</button>`).join("")}
      </div>
    </div>`;

  const chipBar = chips.length ? `<div class="chips">
      ${chips.map(c=>`<span class="chip-f">${escapeHtml(c.text)}<button onclick='removeChip(${JSON.stringify(c.key)},${JSON.stringify(c.value)})' aria-label="${L("Eltávolítás")}">×</button></span>`).join("")}
      <button class="link" onclick="clearFilters()">${L("Összes szűrő törlése")}</button>
    </div>` : "";

  const facets = r ? `<div class="facets">
      ${FACET_DEFS.map(d=>{
        const vals = (r.facets[d.key]||[]).slice(0, d.key==="goals"?12:8);
        if(!vals.length) return "";
        const sel = state.search.filters[d.key];
        const isOn = v => Array.isArray(sel) ? sel.includes(v) : sel===v;
        return `<div class="facet"><h4>${state.lang==="en"?d.en:d.hu}</h4><div class="fopts">
          ${vals.map(v=>`<button class="fo ${isOn(v.value)?"on":""}" onclick='toggleFacet(${JSON.stringify(d.key)},${JSON.stringify(v.value)})'>
            ${escapeHtml(String(d.label(v.value)))}<span class="n">${v.count}</span></button>`).join("")}
        </div></div>`;
      }).join("")}
    </div>` : "";

  let body = "";
  if(s.error){
    body = `<div class="search-empty"><b>${L("A keresés nem érhető el")}</b>${escapeHtml(s.error)}</div>`;
  } else if(s.loading && !r){
    body = `<div class="search-empty">${L("Keresés…")}</div>`;
  } else if(r && !r.results.length){
    body = `<div class="search-empty"><b>${L("Nincs találat")}</b>
      ${L("Próbálj tágabb kifejezést, vagy vegyél le egy szűrőt.")}</div>`;
  } else if(r){
    body = `<div class="opp-grid">${r.results.map(row=>row.locked?lockedCard(row):searchCard(row)).join("")}</div>
      ${upsellBlock(r.lockedCount||0)}${pager(r)}`;
  }

  const cat = catalog.meta && catalog.meta.catalog;
  const src = cat ? `<div class="src-line">
      <span>${LX("Forrás","Source")}: <a href="https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/home" target="_blank" rel="noopener">EU Funding &amp; Tenders Portal</a></span>
      <span>·</span><span>${cat.counts ? cat.counts.total : OPPS.length} ${LX("felhívás a katalógusban","calls in the catalog")}</span>
      ${cat.eurHuf?`<span>·</span><span>1 EUR = ${cat.eurHuf} HUF (${LX("EKB középárfolyam","ECB reference rate")})</span>`:""}
    </div>` : "";

  return `
    <div class="page-head"><h1>${L("Keresés")}</h1>
      <p>${L("Kereshetsz az összes nyitott európai és magyar felhívás között. A találatok a cégprofilodra pontozva jelennek meg.")}</p></div>
    ${bar}
    ${sortBar}
    ${chipBar}
    ${facets}
    ${body}
    ${src}
  `;
}

function searchCard(row){
  const days = row.daysLeft;
  const band = row.band;
  const blocked = row.blocked;
  const bigX = IC.x.replace('width="18" height="18"', 'width="26" height="26"');
  const scoreHtml = blocked
    ? `<div class="opp-score"><div class="n" style="color:var(--red)">${bigX}</div><div class="b">${L("Kizárva")}</div></div>`
    : `<div class="opp-score"><div class="n">${row.score!=null?row.score:"—"}${row.estimated?'<sup style="font-size:11px">*</sup>':""}</div><div class="b">${band?escapeHtml(band.label):""}</div></div>`;

  const money = row.fundingMax
    ? fmtHUF(row.fundingMax) + (row.consortium && row.consortium.required ? " " + LX("(teljes projekt)","(whole project)") : "")
    : L("Nincs megadva");

  const consortiumNote = row.consortium && row.consortium.required
    ? `<span style="color:var(--slate)">${LX("Konzorcium: " + row.consortium.minPartners + "+ partner", "Consortium: " + row.consortium.minPartners + "+ partners")}</span>`
    : `<span style="color:var(--green)">${LX("Önállóan pályázható","Can apply alone")}</span>`;

  return `<div class="opp" onclick="openDetail('${row.id}')">
    ${scoreHtml}
    <div class="opp-body">
      <div class="prog">${escapeHtml(row.program)}${row.sourceRef?" · <span style=\"color:var(--muted)\">" + escapeHtml(row.sourceRef) + "</span>":""}</div>
      <h3>${escapeHtml(row.title)}</h3>
      <div class="opp-meta">
        <span>${L("Határidő")}: <b>${fmtDate(row.deadline)}</b>${days<=30?" · <b style=\"color:var(--amber)\">" + days + " " + L("nap") + "</b>":""}</span>
        <span>${L("Támogatás")}: <b>${money}</b></span>
        <span>${Math.round(row.intensity*100)}% ${L("támogatási intenzitás")}</span>
        ${consortiumNote}
      </div>
      ${blocked && row.blockedReasons.length?`<div class="opp-meta"><span style="color:var(--red)">${escapeHtml(row.blockedReasons[0])}</span></div>`:""}
      ${row.goals && row.goals.length?`<div class="opp-meta">${row.goals.slice(0,4).map(g=>`<span class="badge">${escapeHtml(GOAL_LABEL(g))}</span>`).join("")}</div>`:""}
    </div>
    <div class="opp-right"><span class="opp-cta">${L("Részletek")} ${IC.arrow}</span>${cardSourceLink(row)}</div>
  </div>`;
}

function pager(r){
  const pages = Math.max(1, Math.ceil(r.total / r.pageSize));
  if(pages<=1) return "";
  return `<div class="pager">
    <button onclick="gotoPage(${r.page-1})" ${r.page<=1?"disabled":""}>${L("Előző")}</button>
    <span class="pinfo">${r.page} / ${pages}</span>
    <button onclick="gotoPage(${r.page+1})" ${r.page>=pages?"disabled":""}>${L("Következő")}</button>
  </div>`;
}

function escapeHtml(str){
  return String(str==null?"":str).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function viewOpportunities(ranked){
  const visible=ranked.filter(x=>!x.res.blocked);
  const blocked=ranked.filter(x=>x.res.blocked);
  // Előfizetés nélkül a kliens egyetlen felhívást sem kapott meg, így nincs
  // mit rangsorolni: a szerver által kitakart sorok kerülnek a helyükre.
  if(catalog.gated){
    const st=catalog.stats||{};
    return `
      <div class="page-head"><h1>${L("Pályázatok")}</h1>
        <p>${LX(`A cégprofilod alapján ${st.eligible||catalog.lockedTotal} felhívásra pályázhatsz. Az alábbi pontszámok és összegek valósak.`,
                `Your company profile qualifies for ${st.eligible||catalog.lockedTotal} calls. The scores and amounts below are real.`)}</p></div>
      ${teaserGrid(catalog.teasers, catalog.lockedTotal)}`;
  }
  return `
    <div class="page-head"><h1>${L("Pályázatok")}</h1><p>${L("Minden találat a cégprofilodra rangsorolva. A jogosultsági motor előre kiszűri, amire nem felelsz meg.")}</p></div>

    ${blocked.length?`
      <div class="section-title"><h2>${L("Nem jogosult")} (${blocked.length})</h2>
        <span class="link" style="color:var(--muted);cursor:default">${L("Kizárva a szabálymotor által")}</span></div>
      <div class="opp-grid">${blocked.map(x=>blockedCard(x)).join("")}</div>`:""}

function blockedCard(x){
  const {opp,res}=x;
  const failed=res.elig.checks.filter(c=>c.status==="fail");
  return `<div class="opp" style="opacity:.72" onclick="openDetail('${opp.id}')">
    <div class="opp-score"><div class="n" style="color:var(--red)">${IC.x.replace('width="18" height="18"','width="26" height="26"')}</div><div class="b">${L("Kizárva")}</div></div>
    <div class="opp-body"><div class="prog">${L(opp.program)}</div><h3>${L(opp.title)}</h3>

}

/* ---------------- CALENDAR ---------------- */
const MONTHS_HU=["január","február","március","április","május","június","július","augusztus","szeptember","október","november","december"];
const MONTHS_EN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTHS=new Proxy({},{get:(_,i)=> (state.lang==="en"?MONTHS_EN:MONTHS_HU)[i]});
function miniCalendar(list){
  const items=[...list].sort((a,b)=>new Date(a.opp.deadline)-new Date(b.opp.deadline));
  return `<div class="cal"><div class="cal-month"><div class="cal-mname">${L("Közelgő")}<span>${L("rendezve határidő szerint")}</span></div>
    <div class="cal-events">${items.map(x=>calEvent(x)).join("")}</div></div></div>`;
}
function calEvent(x){
  const {opp,res}=x; const d=daysToDeadline(opp);
  const color=d<=14?"var(--amber)":res.score>=85?"var(--green)":"var(--gold)";
  return `<div class="cal-ev" onclick="openDetail('${opp.id}')">
    <span class="cdot" style="background:${color}"></span>
    <span class="cname">${L(opp.program)} — ${L(opp.title)}</span>
    <span class="cdate">${fmtDate(opp.deadline)}${d<=14?` · ${d} nap`:""}</span></div>`;
}
function viewCalendar(ranked){
  const visible=ranked.filter(x=>!x.res.blocked);
  // A határidő maga is fizetős adat: dátummal együtt a felhívás beazonosítható.
  if(catalog.gated){
    return `
      <div class="page-head"><h1>${L("Funding Calendar")}</h1>
        <p>${L("A közelgő beadási határidőid. A dátumok az előfizetéssel nyílnak meg — addig annyi látszik, hogy hány határidő vár rád és mekkora összegről van szó.")}</p></div>
      ${teaserGrid((catalog.teasers||[]).filter(t=>t.closingSoon), catalog.lockedTotal)}`;
  }
  // csoportosítás hónap szerint
  const byMonth={};
  visible.forEach(x=>{ const dt=new Date(x.opp.deadline); const key=dt.getFullYear()+"-"+dt.getMonth();
    (byMonth[key]=byMonth[key]||[]).push(x); });
  const keys=Object.keys(byMonth).sort((a,b)=>{const[ay,am]=a.split("-").map(Number);const[by,bm]=b.split("-").map(Number);return ay-by||am-bm;});
  return `
    <div class="page-head"><h1>${L("Funding Calendar")}</h1><p>${L("Nem neked kell figyelned a határidőket — a Hunter figyeli helyetted. Csak a 70+ Hunter Score-ú, releváns találatok jelennek meg.")}</p></div>
    <div class="cal">
    ${keys.map(k=>{
      const[y,m]=k.split("-").map(Number); const evs=byMonth[k].sort((a,b)=>new Date(a.opp.deadline)-new Date(b.opp.deadline));
      const closing=evs.filter(x=>daysToDeadline(x.opp)<=14).length;
      return `<div class="cal-month">
        <div class="cal-mname">${MONTHS[m].charAt(0).toUpperCase()+MONTHS[m].slice(1)} ${y}
          <span>${LX(`${evs.length} beadási határidő`,`${evs.length} submission deadline${evs.length>1?"s":""}`)}${closing?LX(` · ${closing} sürgős`,` · ${closing} urgent`):""}</span></div>
        <div class="cal-events">${evs.map(x=>calEvent(x)).join("")}</div></div>`;
    }).join("")}
    </div>
    <p class="source-note" style="margin-top:16px">${IC.info} ${LX("Emlékeztetők (30/14/7/3 nap) és .ics export a teljes verzióban. Szakaszos elbírálásnál a keret a határidő előtt kimerülhet.","Reminders (30/14/7/3 days) and .ics export are in the full version. With staged evaluation the budget may run out before the deadline.")}</p>
  `;
}

      {
        title_hu: "1. Vezetői összefoglaló és célkitűzés",
        title_en: "1. Executive Summary and Objectives",
        content_hu: `A ${p.company} (${p.employees} fő, ${p.county} megye) célja a jelenlegi termelési kapacitás modernizációja a(z) ${opp.title} felhívás keretében. A projekt tervezett összköltsége ${Math.round((p.investment_value || 30e6) / 1e6)} M Ft, melyből a várt támogatás mértéke ${Math.round(((p.investment_value || 30e6) * opp.intensity) / 1e6)} M Ft (${Math.round(opp.intensity * 100)}% támogatási intenzitás mellett).`,
        content_en: `${p.company} (${p.employees} employees, ${p.county} county) aims to modernize its production capacity under the ${opp.title} call. Total planned investment is ${Math.round((p.investment_value || 30e6) / 1e6)}M HUF, with expected non-repayable grant aid of ${Math.round(((p.investment_value || 30e6) * opp.intensity) / 1e6)}M HUF (${Math.round(opp.intensity * 100)}% support intensity).`,
      },
      {
        title_hu: "2. Szakmai megvalósítás és technológiai indoklás",
        title_en: "2. Technical Implementation & Feasibility",
        content_hu: `A tervezett fejlesztés közvetlenül illeszkedik a program prioritásaihoz (${opp.goals.join(", ")}). A megvalósítás során a cég a meglévő ${p.teaor} TEÁOR szerinti tevékenységét fejleszti, biztosítva a magasabb hozzáadott értéket és munkahelymegtartást.`,
        content_en: `The planned development directly aligns with programme priorities (${opp.goals.join(", ")}). During implementation, the enterprise expands its core ${p.teaor} NACE activity, generating higher added value.`,
      },
      {
        title_hu: "3. Költségvetési terv és kötelező dokumentumok",
        title_en: "3. Budget Plan & Required Annexes",
        content_hu: `Szükséges önrész: ${Math.round(((p.investment_value || 30e6) * (1 - opp.intensity)) / 1e6)} M Ft. A csatolandó mellékletek: ${(opp.docs || []).join("; ")}.`,

function draftNotice(){

}

function copyDraft(){
  if(!state.hunterPlusDraft) return;

/* ---- beadási linkek ----

   pályázat megkezdésére mutató közvetlen link. Mindkettő a portál saját adata,
   nem generált URL; ha egyik sincs, nem mutatunk hamis gombot. */
function applyLinks(opp){
  return {
    official: opp.sourceUrl || null,
    submit: opp.submissionUrl || null,
    portal: opp.sourceSystem === "EU_FUNDING_TENDERS"
      ? "https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/home"
      : "https://www.palyazat.gov.hu/",

}

function applyButton(opp){
  const l = applyLinks(opp);

    ? LX("Beadás a portálon", "Start the application")

/* ---- részletező nézet segédfüggvényei ---- */
function fundingFactLabel(opp){

}
function fundingFactValue(opp){
  if(!opp.fundingMin && !opp.fundingMax) return L("Nincs megadva");
  if(opp.fundingMin && opp.fundingMax && opp.fundingMin!==opp.fundingMax)
    return fmtHUF(opp.fundingMin)+"–"+fmtHUF(opp.fundingMax);
  return fmtHUF(opp.fundingMax||opp.fundingMin);
}
function applicantSetupText(opp){
  if(opp.consortium && opp.consortium.required)
    return LX(opp.consortium.minPartners+" partner, "+opp.consortium.minCountries+" ország",

  return LX("Önállóan pályázható","Single applicant");
}
function calcHint(opp){
  if(opp.partnerShare)
    return LX("A számítás a becsült partneri részesedéshez igazodik (kb. "+fmtHUF(opp.partnerShare.maxHuf)+" felső határ), nem a teljes projektkerethez.",

              "Funding is capped at the ceiling ("+fmtHUF(opp.fundingMax)+").");

}

       <div class="band-lbl" style="color:${band.color}">${L(band.lbl)}${res.estimated?L(" · becsült"):""}</div>`;

          <div class="fact"><div class="fl">${L("Beadási határidő")}</div><div class="fv">${fmtDate(opp.deadline)}</div></div>
          <div class="fact"><div class="fl">${L("Pályázói forma")}</div><div class="fv" style="font-size:14px">${applicantSetupText(opp)}</div></div>
        </div>
      </div>
      <div style="align-self:center">${scoreBlock}</div>

        <h2>${L("Hunter Score bontása")}</h2>
        <p class="psub">${L("Öt faktor, a spec szerinti súlyozással. Kattints egy faktorra a részletes indoklásért.")}</p>
        ${factorRow(L("Jogosultság"),res.factors.elig,0.35,eligFactorDetail(elig))}
        ${factorRow(L("Projektilleszkedés"),res.factors.fit,0.25,fitFactorDetail(opp,p))}
        ${factorRow(L("Finanszírozási méret"),res.factors.size,0.15,sizeFactorDetail(opp,p))}
        ${factorRow(L("Határidő"),res.factors.timing,0.15,timingFactorDetail(opp))}
        ${factorRow(L("Megvalósíthatóság"),res.factors.feas,0.10,feasFactorDetail(opp))}

      <div class="panel">

function eligPill(status){
  if(status==="ELIGIBLE") return `<span class="badge badge-green">${IC.check.replace('width="18" height="18"','width="13" height="13"')} ${L("Jogosult")}</span>`;
  if(status==="CONDITIONAL") return `<span class="badge badge-amber">${L("Feltételesen jogosult")}</span>`;
  if(status==="INSUFFICIENT_DATA") return `<span class="badge badge-slate">${L("Hiányzó adat")}</span>`;
  return `<span class="badge badge-red">${L("Nem jogosult")}</span>`;
}
function oppRegionText(opp){ // translated at render
  const r=opp.hard.find(h=>h.field==="region");
  if(!r) return L("Magyarország");
  if(r.op==="not_in") return L("Magyarország (Budapest kizárva)");
  if(r.op==="in") return L("Vidéki régiók");
  return L("Magyarország");
}
function fmtVal(field,val){
  if(val===undefined||val===null) return "—";
  if(field==="employees") return val+" "+L("fő");
  if(field==="region") return REGION_NAME(val);
  if(field==="closed_business_years") return val+" "+L("lezárt év");
  if(field==="investment_value") return fmtHUF(val);
  if(field==="teaor") return "TEÁOR "+val;
  if(field==="de_minimis_ok") return val?L("van keret"):L("nincs keret");
  if(Array.isArray(val)) return val.map(GOAL_LABEL).join(", ");
  return String(val);
}

function factorRow(name,val,weight,detail){
  const pct=Math.round(val*100);
  return `<div class="factor" onclick="toggleFactor(this)">
    <div class="factor-head">
      <span class="fname">${name} <span style="color:var(--muted);font-weight:400;font-size:12px">${Math.round(weight*100)}%</span></span>
      <span class="ftrack"><i style="width:${pct}%"></i></span>
      <span class="fpct">${pct}%</span>
      <span class="fchev">${IC.chev}</span>
    </div>
    <div class="factor-body">${detail}</div>
  </div>`;
}
function toggleFactor(el){ el.classList.toggle("open"); }

function line(status,text,yr,src){
  const ic=status==="pass"?IC.check:status==="fail"?IC.x:status==="cond"?IC.warn:IC.q;
  return `<div class="why-item"><span class="ic">${ic}</span><div>${text} ${yr?`<span class="yr">${LX(`(nálad: ${yr})`,`(yours: ${yr})`)}</span>`:""}${src?`<div class="src">${LX("Forrás","Source")}: ${src}</div>`:""}</div></div>`;
}
function eligFactorDetail(elig){
  return elig.checks.map(c=>line(c.status, ruleLabel(c.rule), fmtVal(c.rule.field,c.value))).join("");
}
function fitFactorDetail(opp,p){
  const goals=p.goals||[];
  const matched=opp.goals.filter(g=>goals.includes(g)).map(GOAL_LABEL);
  const rows=[];
  rows.push(line(matched.length?"pass":"cond",
    matched.length?L("A programcélok illeszkednek a fejlesztési céljaidhoz"):L("Részleges cél-illeszkedés"),
    matched.length?matched.join(", "):goals.map(GOAL_LABEL).join(", ")));
  rows.push(line("pass",LX(`A felhívás fókusza: ${opp.goals.map(GOAL_LABEL).join(", ")}`,`Call focus: ${opp.goals.map(GOAL_LABEL).join(", ")}`),""));
  return rows.join("");
}
function sizeFactorDetail(opp,p){
  const v=p.investment_value; const support=Math.min(v*opp.intensity,opp.fundingMax);
  const inBand = v>=opp.fundingMin;
  return [
    line(inBand?"pass":"cond",L("A tervezett projektméret a támogatható sávban van"), fmtHUF(v)),
    line("pass",LX(`Támogatható keret: ${fmtHUF(opp.fundingMin)}–${fmtHUF(opp.fundingMax)}`,`Fundable range: ${fmtHUF(opp.fundingMin)}–${fmtHUF(opp.fundingMax)}`),""),
    line("pass",LX(`Ebből várható támogatás ~${fmtHUF(support)} (${Math.round(opp.intensity*100)}% intenzitás)`,`Expected funding from this ~${fmtHUF(support)} (${Math.round(opp.intensity*100)}% intensity)`),""),
  ].join("");
}
function timingFactorDetail(opp){
  const d=daysToDeadline(opp);
  const rows=[line(d<14?"cond":"pass",LX(`${d} nap van a beadási határidőig`,`${d} days until the submission deadline`),"")];
  if(opp.highAdmin) rows.push(line("cond",L("Összetett, angol nyelvű anyag — több felkészülési idő kell"),""));
  else rows.push(line("pass",L("A dokumentumok kb. 30 napon belül összeállíthatók"),""));
  return rows.join("");
}
function feasFactorDetail(opp){
  const own=Math.round((1-opp.intensity)*100);
  return [
    line(own>=40?"cond":"pass",LX(`${own}% saját forrás szükséges`,`${own}% own contribution required`),""),
    line("pass",LX(`${opp.docs.length} db kötelező melléklet`,`${opp.docs.length} mandatory attachments`),""),
    opp.highAdmin?line("cond",L("Magas adminisztrációs teher"),""):line("pass",L("Standard adminisztráció"),""),
  ].join("");
}

function whyBlocks(opp,elig){
  const pass=elig.checks.filter(c=>c.status==="pass");
  const cond=elig.conditions;
  const unknown=elig.checks.filter(c=>c.status==="unknown");
  let html="";
  if(pass.length){
    html+=`<div class="why-block"><div class="wt">${L("Miért ajánljuk")}</div><div class="why-list">
      ${pass.map(c=>line("pass",ruleLabel(c.rule),fmtVal(c.rule.field,c.value),opp.source)).join("")}</div></div>`;
  }
  if(cond.length){
    html+=`<div class="why-block"><div class="wt">${L("Mire figyelj")}</div><div class="why-list">
      ${cond.map(c=>line("cond",L(condText(c)),c.type==="own"?"~"+fmtHUF(activeProfile().investment_value*(1-opp.intensity)):"")).join("")}</div></div>`;
  }
  if(unknown.length){
    html+=`<div class="why-block"><div class="wt">${L("Mit nem tudunk még")}</div><div class="why-list">
      ${unknown.map(c=>`${line("unknown",ruleLabel(c.rule),"")}
        ${c.rule.quiz?quizInline(opp.id,c.rule.field,c.rule.quiz):""}`).join("")}</div></div>`;
  }
  return html;
}
function quizInline(oppId,field,quiz){
  return `<div class="quiz-inline"><div class="q">${L(quizText(quiz))}</div><div class="opts">
    ${quiz.opts.map(o=>`<button class="pill-opt" onclick='answerQuiz("${oppId}","${field}",${JSON.stringify(o.v)})'>${L(quizOptText(o))}</button>`).join("")}
  </div></div>`;
}
function answerQuiz(oppId,field,val){
  // A válasz a cégre vonatkozik, nem egyetlen felhívásra, ezért globálisan
  // tároljuk: egy "igen" azonnal feloldja az összes olyan felhívást, amely
  // ugyanezt kérdezte volna.
  if(val===null) delete state.answers[field];
  else state.answers[field]=val;
  delete state.answers[oppId+":"+field];
  saveState();   // a válasz a cégprofil része, a böngésző tárolja
  const affected = OPPS.filter(o=>(o.hard||[]).some(h=>h.field===field)).length;
  render();
  if(val===false) toast(L("Frissítettük a jogosultságot — ez a feltétel nem teljesül"));
  else if(val===null) toast(L("Rögzítve: még tisztázandó"));
  else toast(LX(`Rögzítve — ${affected} felhívás jogosultsága frissült`, `Saved — eligibility recalculated for ${affected} calls`));
}

/* Konzorciumi felhívásnál a céget a saját részesedése korlátozza, nem a teljes
   projektre szóló keret — a kalkulátor ezért a becsült partneri plafonnal
   számol, és ezt ki is írja. */
function grantCeiling(opp){
  if(opp.partnerShare) return opp.partnerShare.maxHuf;
  return opp.fundingMax || null;
}
function calculator(opp,p){
  const v=p.investment_value;
  const cap=grantCeiling(opp);
  const support=cap!=null?Math.min(v*opp.intensity,cap):v*opp.intensity;
  const own=v-support;
  return `<div class="calc">
    <div class="calc-in">
      <div class="field"><label>${L("Tervezett projektérték (Ft)")}</label>
        <input type="number" id="calcVal" value="${v}" oninput="recalc('${opp.id}')"></div>
      <div class="field"><label>${L("Támogatási intenzitás")}</label>
        <input type="text" value="${Math.round(opp.intensity*100)}%" disabled></div>
      <p class="hint">${calcHint(opp)}</p>
    </div>
    <div class="calc-out" id="calcOut">
      <div class="row support"><span class="k">${L("Várható támogatás")}</span><span class="v num">${fmtHUF(support)}</span></div>
      <hr>
      <div class="row"><span class="k">${L("Szükséges önerő")}</span><span class="v num">${fmtHUF(own)}</span></div>
    </div>
  </div>`;
}
function recalc(oppId){
  const opp=catalog.byId.get(oppId) || OPPS.find(o=>o.id===oppId);
  const v=+document.getElementById("calcVal").value||0;
  const cap=grantCeiling(opp);
  const support=cap!=null?Math.min(v*opp.intensity,cap):v*opp.intensity;
  const own=Math.max(0,v-support);
  document.getElementById("calcOut").innerHTML=`
    <div class="row support"><span class="k">${L("Várható támogatás")}</span><span class="v num">${fmtHUF(support)}</span></div>
    <hr><div class="row"><span class="k">${L("Szükséges önerő")}</span><span class="v num">${fmtHUF(own)}</span></div>`;
}

function notEligibleBlock(elig){

}

/* ---- scroll reveal ---- */
function initReveal(){
  const els=document.querySelectorAll('[data-reveal]');
  if(!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches){
    els.forEach(e=>e.classList.add('in')); return;
  }
  const io=new IntersectionObserver((ents)=>{
    ents.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  },{threshold:.12, rootMargin:"0px 0px -8% 0px"});
  els.forEach(e=>io.observe(e));
}

/* ---- betöltő animáció (matching engine fut) ---- */
function showLoader(title, steps, done){
  const ov=document.getElementById("loader");
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  ov.innerHTML=`<div class="loader-card">
    <div class="loader-target">
      <span class="ring"></span><span class="ring"></span><span class="ring"></span>
      <span class="core">${IC.target}</span>
    </div>
    <div class="loader-title">${title}</div>
    <div class="loader-steps">${steps.map(s=>`<div class="lstep"><span class="ld"></span>${s}</div>`).join("")}</div>
    <div class="loader-bar"><i></i></div>
  </div>`;
  ov.classList.add("show");
  if(reduce){ setTimeout(()=>{ ov.classList.remove("show"); done(); setTimeout(()=>{ if(!ov.classList.contains("show")) ov.innerHTML=""; },350); }, 180); return; }
  const bar=ov.querySelector(".loader-bar i");
  const lsteps=[...ov.querySelectorAll(".lstep")];
  const total=1750, per=total/steps.length;
  bar.style.transition=`width ${total}ms cubic-bezier(.4,0,.2,1)`;
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ bar.style.width="100%"; }); });
  lsteps.forEach((el,i)=>{
    setTimeout(()=>{ el.classList.add("active"); if(i>0) lsteps[i-1].classList.add("done"); }, per*i+80);
  });
  setTimeout(()=>lsteps[lsteps.length-1].classList.add("done"), total-120);
  setTimeout(()=>{ ov.classList.remove("show"); done(); setTimeout(()=>{ if(!ov.classList.contains("show")) ov.innerHTML=""; },350); }, total+260);
}


/* =========================================================================
   HUNTER API KLIENS
   A katalógus a szerverről érkezik: az Európai Bizottság Funding & Tenders
   portáljából (SEDIA) normalizált felhívások, a magyar nemzeti programokkal
   kiegészítve. A szabálymotor kliensoldalon fut a szerver által küldött
   {field, op, value} szabályokon, így a rangsor azonnal újraszámolható.
   ========================================================================= */
/* A szerver hibái magyar nyelvű üzenetet hoznak a törzsben — azt mutatjuk a
   felhasználónak, nem a HTTP kódot. */
/* A szerver hibái stabil kódot hoznak a magyar szöveg mellett, így a felület a
   látogató nyelvén tudja megmutatni őket. Ha egy kód ismeretlen, a szerver
   üzenete a tartalék. */
const API_ERRORS = {
  BAD_CREDENTIALS:    ["Hibás felhasználónév vagy jelszó.", "Incorrect username or password."],
  USERNAME_TAKEN:     ["Ez a felhasználónév már foglalt.", "That username is already taken."],
  ACCOUNT_DISABLED:   ["Ezt a fiókot letiltották.", "This account has been disabled."],
  LOGIN_REQUIRED:     ["Bejelentkezés szükséges.", "You need to sign in."],
  ADMIN_REQUIRED:     ["Adminisztrátori jogosultság szükséges.", "Administrator access is required."],
  WRONG_PASSWORD:     ["A jelenlegi jelszó nem megfelelő.", "The current password is incorrect."],
  INVALID_USERNAME:   ["A felhasználónév 3–32 karakter, betű, szám, pont, kötőjel vagy aláhúzás lehet.",
                       "A username is 3–32 characters: letters, digits, dot, hyphen or underscore."],
  WEAK_PASSWORD:      ["A jelszó legalább 4 karakter legyen.", "The password must be at least 4 characters."],
  NO_SUCH_USER:       ["Nincs ilyen felhasználó.", "No such user."],
  NO_SUCH_VERSION:    ["Nincs ilyen mentett verzió.", "No such saved version."],
  UNKNOWN_PLAN:       ["Ismeretlen csomag.", "Unknown plan."],
  CANNOT_DEMOTE_SELF: ["Saját adminisztrátori hozzáférésedet nem vonhatod vissza.",
                       "You cannot revoke your own administrator access."],
  CANNOT_DELETE_SELF: ["Saját fiókodat nem törölheted.", "You cannot delete your own account."],
  NO_SUCH_CONTACT:    ["Nincs ilyen kapcsolat.", "No such contact."],
  NO_SUCH_LEAD:       ["Nincs ilyen érdeklődő.", "No such lead."],
  NO_SUCH_NOTE:       ["Nincs ilyen bejegyzés.", "No such note."],
  NO_SUCH_TASK:       ["Nincs ilyen teendő.", "No such follow-up."],
  UNKNOWN_STAGE:      ["Ismeretlen szakasz.", "Unknown stage."],
  EMPTY_NOTE:         ["A bejegyzés nem lehet üres.", "The note cannot be empty."],
  EMPTY_TASK:         ["A teendőhöz megnevezés kell.", "A follow-up needs a title."],
  INVALID_DUE_DATE:   ["Érvénytelen határidő.", "That due date is not valid."],
  EMAIL_REQUIRED:     ["Adj meg egy e-mail címet.", "Please enter an email address."],
  INVALID_EMAIL:      ["Ez az e-mail cím nem érvényes.", "That email address is not valid."],
  CONSENT_REQUIRED:   ["A megkereséshez hozzájárulás szükséges.", "We need your consent before we may contact you."],
};

async function apiError(res){
  let message = `${res.status} ${res.statusText}`;
  let code = null;
  try {
    const body = await res.json();
    if(body && body.error) message = body.error;
    if(body && body.code) code = body.code;
  } catch(e){}
  const translated = API_ERRORS[code];
  if(translated) message = LX(translated[0], translated[1]);
  const err = new Error(message);
  err.status = res.status;
  err.code = code;
  err.apiMessage = message;
  return err;
}

const api = {
  async get(path){
    const res = await fetch(path, {headers:{"Accept":"application/json"}, credentials:"same-origin"});
    if(!res.ok) throw await apiError(res);
    return res.json();
  },
  /* Nincs bejelentkezés, ezért a cégprofil a böngészőé: minden pontozást kérő
     hívás elviszi magával. A szerver semmit nem tárol a látogatóról, így egy
     hosztolt példányon két látogató sosem látja egymás adatait. */
  identity(){
    return {
      profile: state.profile || null,
      answers: state.answers || {},
      saved: state.saved || [],
    };
  },
  async scored(path, extra){
    return this.post(path, Object.assign(this.identity(), extra || {}));
  },
  async post(path, body){
    const res = await fetch(path, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      credentials:"same-origin",       // a munkamenet-süti mindig menjen el
      body: body===undefined ? undefined : JSON.stringify(body),
    });
    if(!res.ok) throw await apiError(res);
    return res.json();
  },
};

/* A teljes katalógus egyszeri betöltése. A rangsoroláshoz, a naptárhoz és a
   "miért nem jogosult" listához minden nyitott felhívás kell, a hozzájuk
   tartozó {field, op, value} szabályokkal együtt — a szabad szavas keresés
   viszont a szerver indexét használja, nem ezt a listát. */
async function loadCatalog(){
  if(catalog.loading) return catalog.promise;
  if(catalog.loaded) return Promise.resolve();
  catalog.loading = true;
  catalog.promise = (async () => {
    try {
      const [meta, data] = await Promise.all([
        api.get("/api/meta"),
        api.scored("/api/catalog"),   // a profil kell a jogosultsági kerethez
      ]);
      setCatalog(data.opportunities, meta, data);
    } catch(err){
      catalog.error = err.message;
      catalog.loaded = true;   // a felület hibaüzenetet mutat, nem üres képernyőt
    } finally {
      catalog.loading = false;
    }
  })();
  return catalog.promise;
}

/* Profil és válaszok szinkronizálása a szerverrel. */
async function syncProfileToServer(){
  if(!state.profile) return;
  /* Nincs mit szinkronizálni: a profil a böngészőé, és minden pontozást kérő
     hívás elviszi magával (lásd api.identity). */
}

/* init */
loadState();
document.documentElement.lang = state.lang;
render();

/* A fiókállapot dönti el, mit láthat a látogató, ezért ez fut először; a
   katalógus ezzel párhuzamosan töltődik. A bejelentkezett cég profilja a
   szerverről jön, hogy eszközök között kövesse a felhasználót. */
(async () => {
  await loadAuth();

  if(state.auth.user){
    try {
      const p = await api.get("/api/profile");
      if(p.profile){
        state.profile = p.profile;
        state.answers = p.answers || state.answers;
        state.saved = p.saved || state.saved;
        saveState();
      }
    } catch(e){}
  }

  if(state.auth.user?.role === "admin" && !state.profile){
    state.workspace = "admin";
    state.appTab = "adminOverview";
    state.screen = "app";
  } else if(state.profile){
    state.screen = "app";
  }
  render();

  await loadCatalog();
  if(state.screen === "app") state.justLoaded = true;
  render();
  if(catalog.error) toast(LX("A katalógus nem érhető el: "+catalog.error, "Catalog unavailable: "+catalog.error));
})();
</script>
